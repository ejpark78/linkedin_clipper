# ==============================================================================
# 🧠 OpenKB Compiler Service Block (Pre-built Image Version)
# ==============================================================================

services:
  openkb:
    image: scraper/openkb:latest
    build:
      context: ${HOST_PROJECT_PATH:-.}/apps/openkb
      dockerfile: docker/Dockerfile
    container_name: scraper-openkb
    profiles:
      - tools
    environment:
      # OpenAI / litellm 규격을 만족시키기 위한 더미 api_key 주입
      - OPENAI_API_KEY=${OPENAI_API_KEY:-anything}
      - LLM_API_KEY=${LLM_API_KEY:-anything}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-http://host.docker.internal:11434/v1}
      - UV_CACHE_DIR=${UV_CACHE_DIR:-/tmp/uv_cache}
      - HOME=${OPENKB_HOME:-/data/openkb}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOST_PROJECT_PATH:-.}/data:/data
    working_dir: /data/openkb

  openkb-web:
    image: scraper/openkb:latest
    container_name: scraper-openkb-web
    profiles:
      - tools
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-anything}
      - LLM_API_KEY=${LLM_API_KEY:-anything}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-http://host.docker.internal:11434/v1}
      - UV_CACHE_DIR=${UV_CACHE_DIR:-/tmp/uv_cache}
      - HOME=/tmp
      - SKIP_OPENKB_CONFIG=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - OPENKB_OUTPUT_PREFIX=${OPENKB_OUTPUT_PREFIX:-data/obsidian}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOST_PROJECT_PATH:-.}/data:/data
    working_dir: /app
    command:
      - streamlit
      - run
      - src/streamlit_app.py
      - --server.port=8501
      - --server.headless=true
      - --server.fileWatcherType=none
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openkb.rule=Host(`kb.localhost`)"
      - "traefik.http.routers.openkb.entrypoints=websecure"
      - "traefik.http.routers.openkb.tls=true"
      - "traefik.http.services.openkb.loadbalancer.server.port=8501"

  openkb-worker:
    image: scraper/openkb:latest
    container_name: scraper-openkb-worker
    profiles:
      - worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-anything}
      - LLM_API_KEY=${LLM_API_KEY:-anything}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-http://host.docker.internal:11434/v1}
      - UV_CACHE_DIR=${UV_CACHE_DIR:-/tmp/uv_cache}
      - HOME=${OPENKB_HOME:-/data/openkb}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - OPENKB_OUTPUT_PREFIX=${OPENKB_OUTPUT_PREFIX:-data/obsidian}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOST_PROJECT_PATH:-.}/data:/data
    working_dir: /app
    command:
      - python
      - -m
      - src
      - worker
