version: '3'

tasks:
  build:
    desc: Build OpenKB Docker image.
    summary: |
      Build the OpenKB Docker image.

      [Usage Examples]
        - task openkb:build
    cmds:
      - '{{.COMPOSE}} build openkb'

  up:
    desc: Start OpenKB container.
    summary: |
      Start the OpenKB container in the background.

      [Usage Examples]
        - task openkb:up
    cmds:
      - '{{.COMPOSE}} --profile tools up -d openkb'

  down:
    desc: Stop OpenKB container.
    summary: |
      Stop the OpenKB container.

      [Usage Examples]
        - task openkb:down
    cmds:
      - '{{.COMPOSE}} stop openkb'



  compile:docker:
    desc: "Docker 컨테이너에서 OpenKB 컴파일"
    summary: |
      Run OpenKB compile pipeline inside a Docker container with configurable LLM engine.

      [Usage Examples]
        - task openkb:compile:docker
        - task openkb:compile:docker CLI_ARGS="--engine ollama --model qwen3.5:9b-mlx"
    cmds:
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} -e PYTHONUNBUFFERED=1 -e OLLAMA_MODEL="{{.MODEL}}" -e LLM_ENGINE="{{.ENGINE}}" -e UNSLOTH_API_KEY="{{.UNSLOTH_API_KEY}}" -e RAW="{{.RAW}}" -e SAMPLE="{{.SAMPLE}}" --entrypoint poe openkb -C /app compile {{.CLI_ARGS}}'

  compile:gui:
    desc: "Streamlit GUI로 OpenKB 컴파일 (https://kb.localhost)"
    summary: |
      Launch OpenKB compile in Streamlit GUI mode accessible at https://kb.localhost.

      [Usage Examples]
        - task openkb:compile:gui
    cmds:
      - '{{.COMPOSE}} run --rm --service-ports {{.RUN_USER}} -e PYTHONUNBUFFERED=1 openkb-streamlit'

  llama:list:
    desc: "llama.cpp 사용 가능한 GGUF 모델 목록"
    summary: |
      List available GGUF model files downloaded via HuggingFace.

      [Usage Examples]
        - task openkb:llama:list
    cmds:
      - |
        echo "=== Available GGUF Models ==="
        find ~/.cache/huggingface/hub -name "*.gguf" -not -name "mmproj*" 2>/dev/null \
          | while read f; do
              size=$(du -hL "$f" 2>/dev/null | awk '{print $1}')
              echo "  $(basename $f)  ($size)"
              echo "    $f"
            done
        echo ""
        echo "llama-server -m <path> --host 0.0.0.0 --port 8080"

  compile:
    desc: "호스트에서 직접 OpenKB 컴파일 (uv run 사용)"
    summary: |
      OpenKB Compile Pipeline — 에이전트 기록과 Joplin 노트를 LLM 기반 지식베이스로 컴파일.

      [Usage]
        task openkb:compile                                               # ollama 기본값
        task openkb:compile -- --engine ollama --model qwen3.5:9b-mlx
        task openkb:compile -- --engine llama.cpp --model <gguf_path>
        task openkb:compile -- -i data/agents/agy --sample 5

      [LLM Engines]

      ● ollama (기본값)
          서버:     ollama serve
          모델 확인: ollama list
          사용법:   --engine ollama --model <name>

      ● llama.cpp
          GGUF 목록 조회:   task openkb:llama:list
          서버 실행:         llama-server -m <gguf_path> --host 127.0.0.1 --port 8080
          CLI 자동 실행:     task openkb:compile -- --engine llama.cpp --model <gguf_path>

      ● unsloth (CLI 전용)
          서버:     unsloth studio -H 0.0.0.0 -p 8888
          사용법:   task openkb:compile -- --engine unsloth --model <model>

      [Options]
        --engine, -e      LLM 엔진 (ollama / llama.cpp / unsloth)
        --model, -m       모델명 또는 GGUF 파일 경로
        --input, -i       입력 경로 (여러번, e.g. -i data/agents/agy)
        --output, -o      출력 raw 경로 (직접 지정)
        --output-base     출력 베이스 디렉토리 (하위에 raw/, cache.json 생성)
        --agent           Agent 타입 필터 (agy / codex / opencode)
        --date-from       시작일 (YYYY-MM-DD)
        --date-to         종료일 (YYYY-MM-DD)
        --sample          최대 파일 수
        --no-cache        캐시 사용 안함
        --no-clean        출력 디렉토리 청소 안함
        --streamlit       Streamlit GUI 모드

      [GUI]
        task openkb:compile:gui  →  https://kb.localhost
    cmds:
      - 'cd apps/openkb && uv run python -m src.openkb {{.CLI_ARGS}}'

  shell:
    desc: Open interactive shell in the OpenKB container.
    summary: |
      Open an interactive bash shell in the OpenKB container.

      [Usage Examples]
        - task openkb:shell
    cmds:
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} --entrypoint bash openkb'

  format:
    desc: Run code formatting in OpenKB container.
    summary: |
      Run automated code formatting (via poe) inside the OpenKB container.

      [Usage Examples]
        - task openkb:format
    cmds:
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} --entrypoint poe openkb -C /app format'

  type-check:
    desc: Run type checking in OpenKB container.
    summary: |
      Run static type checking (via poe) inside the OpenKB container.

      [Usage Examples]
        - task openkb:type-check
    cmds:
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} --entrypoint poe openkb -C /app type-check'
