[project]
name = "wiki-pipeline"
version = "0.1.0"
description = "Wiki pipeline: preprocess → openkb → embed → graph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openkb==0.3.0",
    "click>=8.1.0",
    "streamlit>=1.40.0",
    "redis>=5.0.0",
    "poethepoet>=0.32.2",
    "ruff>=0.9.1",
    "mypy>=1.14.1",
]

[tool.uv]
prerelease = "allow"

[tool.poe.tasks]
preprocess = "python -m src.worker preprocess"
worker = "python -m src.worker"
web = "streamlit run src/web/app.py"
lint = "ruff check src/"
format = "ruff format src/"
format-check = "ruff format --check src/"
type-check = "mypy src/"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
