version: '3'

tasks:
  build:
    desc: Build wiki-web and wiki-worker Docker images.
    summary: |
      Build wiki-web (Streamlit UI) and wiki-worker (Redis worker) images.

      [Usage Examples]
        - task wiki:build
    cmds:
      - '{{.COMPOSE}} build wiki-web'
      - '{{.COMPOSE}} build wiki-worker'

  up:
    desc: Start wiki-web and wiki-worker containers.
    summary: |
      Start both wiki-web (UI) and wiki-worker (Redis consumer) containers.

      [Usage Examples]
        - task wiki:up
    cmds:
      - '{{.COMPOSE}} --profile tools up -d wiki-web'
      - '{{.COMPOSE}} --profile worker up -d wiki-worker'

  down:
    desc: Stop wiki-web and wiki-worker containers.
    summary: |
      Stop both wiki-web and wiki-worker containers.

      [Usage Examples]
        - task wiki:down
    cmds:
      - '{{.COMPOSE}} stop wiki-web wiki-worker'

  pipeline:preprocess:
    desc: "Run preprocess pipeline (collect → normalize → chunk → LLM)"
    summary: |
      Preprocess raw markdown files into chunks and LLM-extracted entities.

      [Usage]
        task wiki:pipeline:preprocess
        task wiki:pipeline:preprocess -- --input data/agents/agy --output preprocessed
        task wiki:pipeline:preprocess -- --chunk-size 1000

      [Options]
        --input, -i     입력 경로 (여러번 가능)
        --output, -o    출력 디렉토리 (기본: data/preprocessed)
        --engine        LLM 엔진 (ollama / llama.cpp)
        --model         LLM 모델명
        --chunk-size    청크 크기 (기본: 2000)
    cmds:
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} wiki-worker python -m src.worker preprocess {{.CLI_ARGS}}'

  pipeline:openkb:
    desc: "Run openkb compile pipeline"
    summary: |
      Compile wiki pages from preprocessed data using openkb.

      [Usage]
        task wiki:pipeline:openkb
        task wiki:pipeline:openkb -- --input data/agents/agy --output data/obsidian
    cmds:
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} wiki-worker python -m src.worker openkb {{.CLI_ARGS}}'
