# ==============================================================================
# 🤖 Agent Development Sandbox Service Block
# ==============================================================================
# - 주소: https://code.localhost/
# - 용도: 코딩 에이전트(opencode, codex, agy)들이 안전하게 작업할 수 있는 웹 기반 VS Code IDE 격리 공간
# - 권한 정책: dangerously-skip-permissions 활성화 대응 (DooD 도커 소켓 바인딩 포함)
# ==============================================================================

services:
  agent-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - tools
    depends_on:
      traefik:
        condition: service_healthy
    environment:
      - PUID=${USER_UID:-1000}
      - PGID=${USER_GID:-1000}
      - TZ=${TZ:-Asia/Seoul}
      - DANGEROUSLY_SKIP_PERMISSIONS=true
    command: --auth none
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      # DooD 구성을 위한 Docker Socket 마운트
      - /var/run/docker.sock:/var/run/docker.sock
      # 호스트의 프로젝트 전체 소스코드를 컨테이너 내부 작업장으로 맵핑
      - ${HOST_PROJECT_PATH:-.}:/home/coder/project
      # IDE 설정 및 익스텐션 영구 보존 마운트
      - ${HOST_PROJECT_PATH:-.}/data/.services/agent-sandbox/local:/home/coder/.local
      - ${HOST_PROJECT_PATH:-.}/data/.services/agent-sandbox/config:/home/coder/.config
      # Antigravity CLI 및 Opencode 에이전트 자격증명 영구 보존 마운트
      - ${HOST_PROJECT_PATH:-.}/data/.services/agent-sandbox/gemini:/home/coder/.gemini
      - ${HOST_PROJECT_PATH:-.}/data/.services/agent-sandbox/opencode:/home/coder/.opencode
      - ${HOST_PROJECT_PATH:-.}/data/.services/agent-sandbox/codex:/home/coder/.codex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sandbox.rule=Host(`code.localhost`)"
      - "traefik.http.routers.sandbox.entrypoints=websecure"
      - "traefik.http.routers.sandbox.tls=true"
      - "traefik.http.services.sandbox.loadbalancer.server.port=8080"
