version: '3'

tasks:
  dump:
    desc: "Dump agent sessions."
    summary: |
      Extract and dump agent session artifacts and diagnostics data.

      [Variables]
        - AGENTS: (옵션) 덤프할 에이전트명 (기본값: "agy,opencode,codex" 멀티 지정)

      [Usage Examples]
        - task agents:dump
        - task agents:dump AGENTS="agy"
    cmds:
      - npm run sessions -w apps/agents -- --all-targets --all --agent={{.AGENTS | default "agy,opencode,codex"}}

  dump:transcripts:
    desc: "Dump agent transcripts."
    summary: |
      Dump JSONL raw transcripts for specific agent conversations.

      [Variables]
        - AGENTS: (옵션) 대상 에이전트 식별자 목록 (기본값: "agy,opencode,codex")

      [Usage Examples]
        - task agents:dump:transcripts
    cmds:
      - npm run sessions -w apps/agents -- --transcript --all --agent={{.AGENTS | default "agy,opencode,codex"}}

  dump:context:
    desc: "Dump agent context."
    summary: |
      Dump current active codebase context gathered by agents.

      [Variables]
        - AGENTS: (옵션) 대상 에이전트 식별자 목록

      [Usage Examples]
        - task agents:dump:context
    cmds:
      - npm run sessions -w apps/agents -- --context --all --agent={{.AGENTS | default "agy,opencode,codex"}}

  dump:brain:
    desc: "Dump agent brain/session memory."
    summary: |
      Dump semantic brain logs and memory segments of active agents.

      [Variables]
        - AGENTS: (옵션) 대상 에이전트 식별자 목록

      [Usage Examples]
        - task agents:dump:brain
    cmds:
      - npm run sessions -w apps/agents -- --brain --all --agent={{.AGENTS | default "agy,opencode,codex"}}

  dump:sysinfo:
    desc: Dump agent system information.
    summary: |
      Display Antigravity CLI system configurations and operational state.

      [Usage Examples]
        - task agents:dump:sysinfo
    cmds:
      - npm run sessions -w apps/agents -- --sysinfo

  dump:all:
    desc: "Dump all agent diagnostics."
    summary: |
      Perform a comprehensive diagnostic dump (transcripts, brain, sysinfo, compressed rules).

      [Variables]
        - AGENTS: (옵션) 대상 에이전트 식별자 목록

      [Usage Examples]
        - task agents:dump:all
    cmds:
      - task: dump:sysinfo
      - task: dump:transcripts
        vars: { AGENTS: '{{.AGENTS | default "agy,opencode,codex"}}' }
      - task: dump:context
        vars: { AGENTS: '{{.AGENTS | default "agy,opencode,codex"}}' }
      - task: dump:brain
        vars: { AGENTS: '{{.AGENTS | default "agy,opencode,codex"}}' }
      - npm run sessions -w apps/agents -- --context --all --agent={{.AGENTS | default "agy,opencode,codex"}}
      - npm run rules -w apps/agents -- --compress
      - npm run rules -w apps/agents -- --lint

  usage:
    desc: Print agent usage diagnostics.
    summary: |
      Calculate and display session durations and token usage metrics.

      [Usage Examples]
        - task agents:usage
    cmds:
      - npm run usage -w apps/agents

  prune:
    desc: Prune agent session data.
    summary: |
      Clean up old workspace directories, scratch records, and cached transcripts.

      [Usage Examples]
        - task agents:prune
    cmds:
      - npm run sessions -w apps/agents -- --prune

  review:
    desc: Run AI code review through Antigravity CLI.
    summary: |
      Run semantic code review on the latest workspace diffs.

      [Usage Examples]
        - task agents:review
    cmds:
      - agy --skill code_review "Run semantic code review on my latest modifications."

  sandbox:up:
    desc: "코딩 에이전트 개발 샌드박스(agent-sandbox) 실행"
    summary: |
      code-server 기반 에이전트 샌드박스 컨테이너를 백그라운드로 실행하고 Traefik 라우팅을 활성화합니다.

      [Usage Examples]
        - task agents:sandbox:up
    cmds:
      - '{{.COMPOSE}} --profile tools up -d agent-sandbox'

  sandbox:down:
    desc: "코딩 에이전트 개발 샌드박스 중지"
    summary: |
      에이전트 샌드박스 컨테이너를 중지합니다.

      [Usage Examples]
        - task agents:sandbox:down
    cmds:
      - '{{.COMPOSE}} stop agent-sandbox'

  sandbox:build:
    desc: "코딩 에이전트 개발 샌드박스 이미지 빌드"
    summary: |
      샌드박스 이미지 및 의존성 환경을 캐시 없이 강제 재빌드합니다.

      [Usage Examples]
        - task agents:sandbox:build
    cmds:
      - '{{.COMPOSE}} --profile tools build --no-cache agent-sandbox'

  sandbox:shell:
    desc: "코딩 에이전트 개발 샌드박스 내 터미널 셸(bash) 접속"
    summary: |
      에이전트 샌드박스 컨테이너 내부 터미널 셸에 인터랙티브하게 접속합니다.

      [Usage Examples]
        - task agents:sandbox:shell
    cmds:
      - '{{.COMPOSE}} exec -it agent-sandbox bash'




