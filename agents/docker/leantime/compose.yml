# ==============================================================================
# 🎯 Leantime Service Block (Project Management Tool)
# ==============================================================================
# - 주소: https://pm.localhost/
# - DB: MySQL 8.4
# - 데이터 경로: ${PROJECT_PATH}/data/.services/leantime
# - 최초 설치: https://pm.localhost/install 접속 후 DB 정보 입력 + 관리자 계정 생성
# ==============================================================================

services:
  leantime:
    image: agents/leantime:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - tools
    depends_on:
      traefik:
        condition: service_healthy
      leantime_db:
        condition: service_healthy
    environment:
      # Database
      - LEAN_DB_HOST=${LEANTIME_DB_HOST:-leantime_db}
      - LEAN_DB_USER=${LEANTIME_DB_USER:-leantime}
      - LEAN_DB_PASSWORD=${LEANTIME_DB_PASSWORD:-leantime}
      - LEAN_DB_DATABASE=${LEANTIME_DB_DATABASE:-leantime}
      - LEAN_DB_PORT=3306
      # Application
      - LEAN_APP_URL=https://${LEANTIME_APP_DOMAIN:-pm.localhost}
      - LEAN_EMAIL_RETURN=${LEANTIME_EMAIL:-noreply@pm.localhost}
      - LEAN_SESSION_PASSWORD=${LEANTIME_SESSION_PASSWORD:-3evBlq9zdUEuzKvVJHWWx3QzsQhturBApxwcws2m}
      - LEAN_SITENAME=${LEANTIME_SITENAME:-Scraper}
      - LEAN_LANGUAGE=${LEANTIME_LANGUAGE:-ko-KR}
      - LEAN_DEFAULT_TIMEZONE=${LEANTIME_TIMEZONE:-Asia/Seoul}
      - LEAN_DEBUG=${LEANTIME_DEBUG:-0}
      - LEAN_LOG_CHANNELS=stderr
      - TZ=${TZ:-Asia/Seoul}
    volumes:
      - ${PROJECT_PATH:-.}/data/.services/leantime/public_userfiles:/var/www/html/public/userfiles
      - ${PROJECT_PATH:-.}/data/.services/leantime/userfiles:/var/www/html/userfiles
      - ${PROJECT_PATH:-.}/data/.services/leantime/plugins:/var/www/html/app/Plugins
      - ${PROJECT_PATH:-.}/data/.services/leantime/logs:/var/www/html/storage/logs
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.leantime.rule=Host(`${LEANTIME_APP_DOMAIN:-pm.localhost}`)"
      - "traefik.http.routers.leantime.entrypoints=websecure"
      - "traefik.http.routers.leantime.tls=true"
      - "traefik.http.services.leantime.loadbalancer.server.port=8080"

  leantime_db:
    image: mysql:8.4
    profiles:
      - tools
    environment:
      - MYSQL_ROOT_PASSWORD=${LEANTIME_DB_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${LEANTIME_DB_DATABASE:-leantime}
      - MYSQL_USER=${LEANTIME_DB_USER:-leantime}
      - MYSQL_PASSWORD=${LEANTIME_DB_PASSWORD:-leantime}
      - TZ=${TZ:-Asia/Seoul}
    volumes:
      - ${PROJECT_PATH:-.}/data/.services/leantime/mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 5

  leantime_db_helper:
    image: mysql:8.4
    profiles:
      - helper
    command: chown -R mysql:mysql /var/lib/mysql
    volumes:
      - ${PROJECT_PATH:-.}/data/.services/leantime/mysql:/var/lib/mysql
    user: root
