version: "3"

tasks:
  init:
    desc: Leantime 초기 설치 (인증서 → 실행)
    summary: |
      SSL 인증서를 갱신하고 Leantime 컨테이너를 실행합니다.
      이후 https://pm.localhost/install 에서 관리자 계정을 생성하세요.

      [Usage Examples]
        - task leantime:init
    cmds:
      - task traefik:mkcert
      - "{{.COMPOSE}} up -d leantime leantime_db"
      - sleep 10

  install:
    desc: Leantime 초기 설치 안내 출력
    summary: |
      Leantime 초기 설치 방법을 안내합니다.
      docker compose로 컨테이너를 실행한 후 웹브라우저에서 설치를 완료하세요.

      [DB 접속 정보]
        - DB Host: leantime_db
        - DB User: leantime
        - DB Pass: leantime
        - DB Name: leantime

      [설치 순서]
        1. task leantime:init 로 컨테이너 실행
        2. 브라우저에서 https://pm.localhost/install 접속
        3. DB 정보가 자동 입력되어 있음 (기본값 그대로 Next)
        4. 관리자 계정 생성 후 로그인

      [Usage Examples]
        - task leantime:install
    cmds:
      - |
        echo "=============================="
        echo "  Leantime 초기 설치 안내"
        echo "=============================="
        echo ""
        echo "자세한 내용은 task leantime:install --summary 를 참고하세요."
        echo "  → https://pm.localhost/install"
        echo "=============================="
