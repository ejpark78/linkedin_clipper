# ==============================================================================
# 🤖 Agent Development Sandbox Service Block
# ==============================================================================
# - 주소: https://sandbox.localhost/
# - 용도: 코딩 에이전트(opencode, codex, agy)들이 안전하게 작업할 수 있는 웹 기반 VS Code IDE 격리 공간
# - 권한 정책: dangerously-skip-permissions 활성화 대응 (DooD 도커 소켓 바인딩 포함)
# ==============================================================================

services:
  sandbox:
    image: agents/sandbox:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      traefik:
        condition: service_healthy
      gitea:
        condition: service_healthy
    environment:
      - PUID=${USER_UID:-1000}
      - PGID=${USER_GID:-1000}
      - TZ=${TZ:-Asia/Seoul}
    command: --auth none --bind-addr 0.0.0.0:8080 ${PROJECT_PATH:-.}
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      # DooD 구성을 위한 Docker Socket 마운트
      - /var/run/docker.sock:/var/run/docker.sock
      # 호스트의 프로젝트 전체 소스코드를 컨테이너 내부 작업장으로 맵핑
      - ${PROJECT_PATH:-.}:${PROJECT_PATH:-.}
      # IDE 설정 및 익스텐션 영구 보존 마운트
      - ${PROJECT_PATH:-.}/.sandbox/local:/home/ubuntu/.local
      - ${PROJECT_PATH:-.}/.sandbox/config:/home/ubuntu/.config
      # Antigravity CLI 및 Opencode 에이전트 자격증명 영구 보존 마운트
      - ${PROJECT_PATH:-.}/.sandbox/cline:/home/ubuntu/.cline
      - ${PROJECT_PATH:-.}/.sandbox/codex:/home/ubuntu/.codex
      - ${PROJECT_PATH:-.}/.sandbox/gemini:/home/ubuntu/.gemini
      - ${PROJECT_PATH:-.}/.sandbox/opencode:/home/ubuntu/.opencode
      - ${PROJECT_PATH:-.}/.sandbox/qwen:/home/ubuntu/.qwen
      - ${PROJECT_PATH:-.}/.sandbox/kimi:/home/ubuntu/.kimi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sandbox.rule=Host(`sandbox.localhost`)"
      - "traefik.http.routers.sandbox.entrypoints=websecure"
      - "traefik.http.routers.sandbox.tls=true"
      - "traefik.http.services.sandbox.loadbalancer.server.port=8080"
