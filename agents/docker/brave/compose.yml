# ==============================================================================
# 🦁 Brave Browser Service Block (Self-Hosted Web Browser)
# ==============================================================================
# - 주소: https://brave.localhost/
# - 용도: KasmVNC 기반 Brave 브라우저 (linuxserver.io)
# - 포트: Traefik을 통한 80/443 SSL 프록시 포트 포워딩 (호스트 포트 직접 노출 없음)
# ==============================================================================

services:
  brave:
    platform: linux/${ARCH:-arm64}
    image: lscr.io/linuxserver/brave:latest
    security_opt:
      - seccomp:unconfined # Required for Electron rendering in containers
    depends_on:
      traefik:
        condition: service_healthy
    environment:
      - PUID=${USER_UID:-1000}
      - PGID=${USER_GID:-1000}
      - TZ=${TZ:-Asia/Seoul}
    volumes:
      - ${PROJECT_PATH:-.}/data/brave:/config
    shm_size: "1gb"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.brave.rule=Host(`brave.localhost`)"
      - "traefik.http.routers.brave.entrypoints=websecure"
      - "traefik.http.routers.brave.tls=true"
      - "traefik.http.services.brave.loadbalancer.server.port=3000"
