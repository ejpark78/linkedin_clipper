version: '3'

tasks:
  config:
    desc: Show Traefik Compose config.
    summary: |
      Print the resolved Docker Compose configuration for Traefik.

      [Usage Examples]
        - task traefik:config
    cmds:
      - '{{.COMPOSE}} config'
  build:
    desc: Build Traefik image.
    summary: |
      Build the Traefik Docker image without cache.

      [Usage Examples]
        - task traefik:build
    cmds:
      - '{{.COMPOSE}} build --no-cache traefik'
  up:
    desc: Start Traefik reverse proxy.
    summary: |
      Start the Traefik reverse proxy container.

      [Usage Examples]
        - task traefik:up
    cmds:
      - '{{.COMPOSE}} --profile tools up -d traefik'
  down:
    desc: Stop Traefik.
    summary: |
      Stop the Traefik reverse proxy container.

      [Usage Examples]
        - task traefik:down
    cmds:
      - '{{.COMPOSE}} stop traefik'



  mkcert:
    desc: Generate local Traefik certificates with mkcert.
    summary: |
      Automatically generate trusted SSL certificates by scanning docker compose
      for all Traefik Host() rules.

      [Usage Examples]
        - task traefik:mkcert

      [주의 사항]
        - mkcert 실행 후 브라우저가 새 인증서를 즉시 읽지 못하면, 브라우저 프로세스를 완전히 강제 종료(예: pkill -f "Brave Browser" 또는 pkill -f "Google Chrome")한 뒤 다시 구동해야 캐시가 초기화됩니다.
    cmds:
      - command -v mkcert >/dev/null 2>&1 || { echo "⛔ 호스트에 mkcert가 설치되어 있지 않습니다."; exit 1; }
      - mkcert -install
      - mkdir -p agents/.volumes/traefik/certs
      - |
        HOSTS=$( {{.COMPOSE}} --profile '*' config 2>/dev/null \
          | grep "Host(\`" \
          | sed 's/.*Host(`//' \
          | sed 's/`).*//' \
          | sort -u \
          | tr '\n' ' ' )
        echo "🔍 Detected hosts: $HOSTS"
        mkcert -cert-file agents/.volumes/traefik/certs/local-cert.pem \
               -key-file agents/.volumes/traefik/certs/local-key.pem \
               localhost 127.0.0.1 "*.localhost" $HOSTS
      - echo "✅ 로컬 SSL 인증서가 성공적으로 생성 및 갱신되었습니다."
      - echo "💡 브라우저가 새 인증서 상태를 즉시 반영하지 못할 경우, 완전히 종료(pkill -f \"Brave Browser\" 또는 pkill -f \"Google Chrome\") 후 재시작하십시오."

