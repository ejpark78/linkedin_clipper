# ==============================================================================
# 🤖 Agent Development Desktop (Selkies) Service Block
# ==============================================================================
# - 주소: https://openbox.localhost/
# - 용도: OpenCode Desktop, 웹 브라우저 기반 GUI 연동 격리 개발 공간 (Selkies / Labwc)
# ==============================================================================

services:
  openbox:
    image: agents/openbox:latest
    build:
      context: .
      dockerfile: Dockerfile
    security_opt:
      - seccomp:unconfined
    depends_on:
      traefik:
        condition: service_healthy
      gitea:
        condition: service_healthy
    environment:
      - PUID=${USER_UID:-1000}
      - PGID=${USER_GID:-1000}
      - TZ=${TZ:-Asia/Seoul}
      - PROJECT_PATH=${PROJECT_PATH:-.}
      - PIXELFLUX_WAYLAND=true
      - SELKIES_DESKTOP=true
      - NO_FULL=true
      - NO_DECOR=false
      - START_DOCKER=false
      - LC_ALL=ko_KR.UTF-8
    volumes:
      # DooD 구성을 위한 Docker Socket 마운트
      - /var/run/docker.sock:/var/run/docker.sock
      # 호스트의 프로젝트 전체 소스코드를 컨테이너 내부 작업장으로 맵핑
      - ${PROJECT_PATH:-.}:${PROJECT_PATH:-.}
      # IDE 설정 및 익스텐션 영구 보존 마운트
      - ${PROJECT_PATH:-.}/.sandbox/local:/config/.local
      - ${PROJECT_PATH:-.}/.sandbox/config:/config/.config
      # Antigravity CLI 및 Opencode 에이전트 자격증명 영구 보존 마운트
      - ${PROJECT_PATH:-.}/.sandbox/cline:/config/.cline
      - ${PROJECT_PATH:-.}/.sandbox/codex:/config/.codex
      - ${PROJECT_PATH:-.}/.sandbox/gemini:/config/.gemini
      - ${PROJECT_PATH:-.}/.sandbox/kimi:/config/.kimi
      - ${PROJECT_PATH:-.}/.sandbox/opencode:/config/.opencode
      - ${PROJECT_PATH:-.}/.sandbox/qwen:/config/.qwen
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openbox.rule=Host(`openbox.localhost`)"
      - "traefik.http.routers.openbox.entrypoints=websecure"
      - "traefik.http.routers.openbox.tls=true"
      - "traefik.http.services.openbox.loadbalancer.server.port=3000"
