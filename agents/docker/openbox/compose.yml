# ==============================================================================
# 📟 OpenBox Desktop Service Block (Self-Hosted Desktop IDE)
# ==============================================================================
# - 주소: https://openbox.localhost/
# - 용도: Selkies 기반 VS Code 데스크탑 (linuxserver.io)
# - 포트: Traefik을 통한 80/443 SSL 프록시 포트 포워딩 (호스트 포트 직접 노출 없음)
# ==============================================================================

services:
  openbox:
    platform: linux/${ARCH:-arm64}
    image: agents/openbox:${ARCH:-arm64}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUID: ${USER_UID:-1000}
        PGID: ${USER_GID:-1000}
    cap_add:
      - IPC_LOCK
    security_opt:
      - seccomp:unconfined # Required for Electron rendering in containers
    depends_on:
      traefik:
        condition: service_healthy
    environment:
      - PUID=${USER_UID:-1000}
      - PGID=${USER_GID:-1000}
      - TZ=${TZ:-Asia/Seoul}
      - SELKIES_DESKTOP=true
      - XKB_DEFAULT_OPTIONS=caps:swapescape
      - XDG_RUNTIME_DIR=/config/.runtime
    volumes:
      # DooD 구성을 위한 Docker Socket 마운트
      - /var/run/docker.sock:/var/run/docker.sock
      # 호스트의 프로젝트 전체 소스코드를 컨테이너 내부 작업장으로 맵핑
      - ${PROJECT_PATH:-.}:${PROJECT_PATH:-.}
      # Container-private: 호스트 바이너리 충돌 방지 (arm64 vs amd64)
      - sandbox_node_modules:${PROJECT_PATH:-.}/node_modules
      - sandbox_venv:${PROJECT_PATH:-.}/.venv
      # IDE 설정 및 익스텐션 영구 보존 마운트
      - ${PROJECT_PATH:-.}/.openbox/local:/config/.local
      - ${PROJECT_PATH:-.}/.openbox/config:/config/.config
      # Antigravity CLI 및 Opencode 에이전트 자격증명 영구 보존 마운트
      - ${PROJECT_PATH:-.}/.openbox/cline:/config/.cline
      - ${PROJECT_PATH:-.}/.openbox/codex:/config/.codex
      - ${PROJECT_PATH:-.}/.openbox/gemini:/config/.gemini
      - ${PROJECT_PATH:-.}/.openbox/opencode:/config/.opencode
      - ${PROJECT_PATH:-.}/.openbox/qwen:/config/.qwen
      - ${PROJECT_PATH:-.}/.openbox/kimi:/config/.kimi
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q 3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openbox.rule=Host(`openbox.localhost`)"
      - "traefik.http.routers.openbox.entrypoints=websecure"
      - "traefik.http.routers.openbox.tls=true"
      - "traefik.http.services.openbox.loadbalancer.server.port=3000"
