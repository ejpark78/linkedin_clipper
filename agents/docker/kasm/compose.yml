# ==============================================================================
# 🤖 Agent Development Desktop (KasmVNC) Service Block
# ==============================================================================
# - 주소: https://kasm.localhost/
# - 용도: OpenCode Desktop, 웹 브라우저 기반 GUI 연동 격리 개발 공간 (KasmVNC / Openbox)
# ==============================================================================

services:
  kasm:
    platform: linux/${ARCH:-arm64}
    image: agents/kasm:${ARCH:-arm64}
    build:
      context: .
      dockerfile: Dockerfile
    shm_size: "1gb"
    depends_on:
      traefik:
        condition: service_healthy
    environment:
      - KASM_USER=kasm_user
      - VNC_PW=opencode
      - VNCOPTIONS=-disableBasicAuth
      - LC_ALL=ko_KR.UTF-8
      - LANG=ko_KR.UTF-8
      - LANGUAGE=ko_KR.UTF-8
      - PROJECT_PATH=${PROJECT_PATH:-.}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECT_PATH:-.}:${PROJECT_PATH:-.}
      - ${PROJECT_PATH:-.}/.sandbox/local:/home/kasm-user/.local
      - ${PROJECT_PATH:-.}/.sandbox/config:/home/kasm-user/.config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q 6901"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kasm.rule=Host(`kasm.localhost`)"
      - "traefik.http.routers.kasm.entrypoints=websecure"
      - "traefik.http.routers.kasm.tls=true"
      - "traefik.http.routers.kasm.service=kasm"
      - "traefik.docker.network=scraper_default"
      - "traefik.http.services.kasm.loadbalancer.server.port=6901"
      - "traefik.http.services.kasm.loadbalancer.server.scheme=https"
