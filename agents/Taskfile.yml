version: "3"

tasks:
  session:dump:
    desc: "Dump agent sessions."
    summary: |
      Extract and dump agent session artifacts and diagnostics data.

      [Variables]
        - AGENTS: (옵션) 덤프할 에이전트명 (기본값: "agy,opencode,codex" 멀티 지정)

      [Usage Examples]
        - task agents:session:dump
        - task agents:session:dump AGENTS="agy"
    cmds:
      - npm run sessions -w agents -- --all-targets --all --agent={{.AGENTS | default "agy,opencode,codex"}} {{.CLI_ARGS}}

  session:dump:transcripts:
    desc: "Dump agent transcripts."
    summary: |
      Dump JSONL raw transcripts for specific agent conversations.

      [Variables]
        - AGENTS: (옵션) 대상 에이전트 식별자 목록 (기본값: "agy,opencode,codex")

      [Usage Examples]
        - task agents:session:dump:transcripts
    cmds:
      - npm run sessions -w agents -- --transcript --all --agent={{.AGENTS | default "agy,opencode,codex"}} {{.CLI_ARGS}}

  session:dump:context:
    desc: "Dump agent context."
    summary: |
      Dump current active codebase context gathered by agents.

      [Variables]
        - AGENTS: (옵션) 대상 에이전트 식별자 목록

      [Usage Examples]
        - task agents:session:dump:context
    cmds:
      - npm run sessions -w agents -- --context --all --agent={{.AGENTS | default "agy,opencode,codex"}} {{.CLI_ARGS}}

  session:dump:brain:
    desc: "Dump agent brain/session memory."
    summary: |
      Dump semantic brain logs and memory segments of active agents.

      [Variables]
        - AGENTS: (옵션) 대상 에이전트 식별자 목록

      [Usage Examples]
        - task agents:session:dump:brain
    cmds:
      - npm run sessions -w agents -- --brain --all --agent={{.AGENTS | default "agy,opencode,codex"}} {{.CLI_ARGS}}

  session:dump:sysinfo:
    desc: Dump agent system information.
    summary: |
      Display Antigravity CLI system configurations and operational state.

      [Usage Examples]
        - task agents:session:dump:sysinfo
    cmds:
      - npm run sessions -w agents -- --sysinfo {{.CLI_ARGS}}

  session:dump:all:
    desc: "Dump all agent diagnostics."
    summary: |
      Perform a comprehensive diagnostic dump (transcripts, brain, sysinfo, compressed rules).

      [Variables]
        - AGENTS: (옵션) 대상 에이전트 식별자 목록

      [Usage Examples]
        - task agents:session:dump:all
    cmds:
      - task: session:dump:sysinfo
        vars: { CLI_ARGS: "{{.CLI_ARGS}}" }
      - task: session:dump:transcripts
        vars:
          {
            AGENTS: '{{.AGENTS | default "agy,opencode,codex"}}',
            CLI_ARGS: "{{.CLI_ARGS}}",
          }
      - task: session:dump:context
        vars:
          {
            AGENTS: '{{.AGENTS | default "agy,opencode,codex"}}',
            CLI_ARGS: "{{.CLI_ARGS}}",
          }
      - task: session:dump:brain
        vars:
          {
            AGENTS: '{{.AGENTS | default "agy,opencode,codex"}}',
            CLI_ARGS: "{{.CLI_ARGS}}",
          }
      - npm run sessions -w agents -- --context --all --agent={{.AGENTS | default "agy,opencode,codex"}} {{.CLI_ARGS}}
      - npm run rules -w agents -- --compress {{.CLI_ARGS}}
      - npm run rules -w agents -- --lint {{.CLI_ARGS}}

  usage:
    desc: Print agent usage diagnostics.
    summary: |
      Calculate and display session durations and token usage metrics.

      [Usage Examples]
        - task agents:usage
    cmds:
      - npm run usage -w agents -- {{.CLI_ARGS}}

  session:prune:
    desc: Prune agent session data.
    summary: |
      Clean up old workspace directories, scratch records, and cached transcripts.

      [Usage Examples]
        - task agents:prune
    cmds:
      - npm run sessions -w agents -- --prune {{.CLI_ARGS}}

  session:sync:
    desc: "양방향 세션 DB 동기화 (호스트 ↔ 컨테이너 / 컨테이너 ↔ 컨테이너)"
    summary: |
      기본값은 opencode. --codex / --agy 플래그로 각각 동기화 가능.

      [에이전트 선택]
        (기본값)                     opencode 동기화
        --opencode                   opencode 동기화 (명시적)
        --codex                      Codex CLI 동기화
        --agy                        Antigravity CLI 동기화
        --opencode --codex --agy     셋 다 실행

      [엔드포인트 지정]
        --left <name>[,<name>]       왼쪽 엔드포인트 (기본값: host)
        --right <name>[,<name>]      오른쪽 엔드포인트 (기본값: sandbox)
        name = host 또는 Docker Compose 서비스명

      [옵션]
        --dry-run    변경 예정 목록만 출력
        --force      경고 무시 (스키마 불일치, opencode 실행 중 등)
        --no-snapshot    opencode snapshot/ 제외
        --no-tool-output opencode tool-output/ 제외

      [Usage Examples]
        - task agents:session:sync                                     # host ↔ sandbox
    cmds:
      - npm run sessions -w agents -- --sync {{.CLI_ARGS}}

  review:
    desc: Run AI code review through Antigravity CLI.
    summary: |
      Run semantic code review on the latest workspace diffs.

      [Usage Examples]
        - task agents:review
    cmds:
      - agy --skill code_review "Run semantic code review on my latest modifications." {{.CLI_ARGS}}
