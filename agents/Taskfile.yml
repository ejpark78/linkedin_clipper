version: '3'

tasks:
  session:dump:
    desc: "Dump agent sessions."
    summary: |
      Extract and dump agent session artifacts and diagnostics data.

      [Variables]
        - AGENTS: (옵션) 덤프할 에이전트명 (기본값: "agy,opencode,codex" 멀티 지정)

      [Usage Examples]
        - task agents:session:dump
        - task agents:session:dump AGENTS="agy"
    cmds:
      - npm run sessions -w agents -- --all-targets --all --agent={{.AGENTS | default "agy,opencode,codex"}} {{.CLI_ARGS}}

  session:dump:transcripts:
    desc: "Dump agent transcripts."
    summary: |
      Dump JSONL raw transcripts for specific agent conversations.

      [Variables]
        - AGENTS: (옵션) 대상 에이전트 식별자 목록 (기본값: "agy,opencode,codex")

      [Usage Examples]
        - task agents:session:dump:transcripts
    cmds:
      - npm run sessions -w agents -- --transcript --all --agent={{.AGENTS | default "agy,opencode,codex"}} {{.CLI_ARGS}}

  session:dump:context:
    desc: "Dump agent context."
    summary: |
      Dump current active codebase context gathered by agents.

      [Variables]
        - AGENTS: (옵션) 대상 에이전트 식별자 목록

      [Usage Examples]
        - task agents:session:dump:context
    cmds:
      - npm run sessions -w agents -- --context --all --agent={{.AGENTS | default "agy,opencode,codex"}} {{.CLI_ARGS}}

  session:dump:brain:
    desc: "Dump agent brain/session memory."
    summary: |
      Dump semantic brain logs and memory segments of active agents.

      [Variables]
        - AGENTS: (옵션) 대상 에이전트 식별자 목록

      [Usage Examples]
        - task agents:session:dump:brain
    cmds:
      - npm run sessions -w agents -- --brain --all --agent={{.AGENTS | default "agy,opencode,codex"}} {{.CLI_ARGS}}

  session:dump:sysinfo:
    desc: Dump agent system information.
    summary: |
      Display Antigravity CLI system configurations and operational state.

      [Usage Examples]
        - task agents:session:dump:sysinfo
    cmds:
      - npm run sessions -w agents -- --sysinfo {{.CLI_ARGS}}

  session:dump:all:
    desc: "Dump all agent diagnostics."
    summary: |
      Perform a comprehensive diagnostic dump (transcripts, brain, sysinfo, compressed rules).

      [Variables]
        - AGENTS: (옵션) 대상 에이전트 식별자 목록

      [Usage Examples]
        - task agents:session:dump:all
    cmds:
      - task: session:dump:sysinfo
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }
      - task: session:dump:transcripts
        vars: { AGENTS: '{{.AGENTS | default "agy,opencode,codex"}}', CLI_ARGS: '{{.CLI_ARGS}}' }
      - task: session:dump:context
        vars: { AGENTS: '{{.AGENTS | default "agy,opencode,codex"}}', CLI_ARGS: '{{.CLI_ARGS}}' }
      - task: session:dump:brain
        vars: { AGENTS: '{{.AGENTS | default "agy,opencode,codex"}}', CLI_ARGS: '{{.CLI_ARGS}}' }
      - npm run sessions -w agents -- --context --all --agent={{.AGENTS | default "agy,opencode,codex"}} {{.CLI_ARGS}}
      - npm run rules -w agents -- --compress {{.CLI_ARGS}}
      - npm run rules -w agents -- --lint {{.CLI_ARGS}}

  usage:
    desc: Print agent usage diagnostics.
    summary: |
      Calculate and display session durations and token usage metrics.

      [Usage Examples]
        - task agents:usage
    cmds:
      - npm run usage -w agents -- {{.CLI_ARGS}}

  session:prune:
    desc: Prune agent session data.
    summary: |
      Clean up old workspace directories, scratch records, and cached transcripts.

      [Usage Examples]
        - task agents:prune
    cmds:
      - npm run sessions -w agents -- --prune {{.CLI_ARGS}}

  session:sync:codex:
    desc: "양방향 codex CLI 세션 DB 동기화 (호스트 ↔ 샌드박스)"
    summary: |
      Host/Sandbox 양쪽의 codex SQLite DB와 rollout 파일을 동기화합니다.

      [옵션]
        --direction (host-to-sandbox|sandbox-to-host|both) (기본값: both)
        --dry-run    변경 예정 목록만 출력
        --force      경고 무시

      [Usage Examples]
        - task agents:session:sync:codex
        - task agents:session:sync:codex -- --dry-run
    cmds:
      - npm run sessions -w agents -- --sync --codex {{.CLI_ARGS}}

  session:sync:
    desc: "양방향 opencode 세션 DB 동기화 (호스트 ↔ 샌드박스)"
    summary: |
      Host/Sandbox 양쪽의 opencode.db, snapshot/, tool-output/ 데이터를 동기화합니다.

      [옵션]
        --direction (host-to-sandbox|sandbox-to-host|both) (기본값: both)
        --dry-run    변경 예정 목록만 출력
        --force      경고 무시 (스키마 불일치, opencode 실행 중 등)
        --no-snapshot    snapshot/ 제외
        --no-tool-output tool-output/ 제외

      [Usage Examples]
        - task agents:session:sync
        - task agents:session:sync -- --dry-run
        - task agents:session:sync -- --direction host-to-sandbox
    cmds:
      - npm run sessions -w agents -- --sync {{.CLI_ARGS}}

  review:
    desc: Run AI code review through Antigravity CLI.
    summary: |
      Run semantic code review on the latest workspace diffs.

      [Usage Examples]
        - task agents:review
    cmds:
      - agy --skill code_review "Run semantic code review on my latest modifications." {{.CLI_ARGS}}

  sandbox:up:
    desc: "코딩 에이전트 개발 샌드박스(sandbox) 실행"
    summary: |
      code-server 기반 에이전트 샌드박스 컨테이너를 백그라운드로 실행하고 Traefik 라우팅을 활성화합니다.

      [Usage Examples]
        - task agents:sandbox:up
    cmds:
      - '{{default "docker compose -p project -f compose.yml" .COMPOSE}} --profile tools up -d sandbox'

  sandbox:down:
    desc: "코딩 에이전트 개발 샌드박스 중지"
    summary: |
      에이전트 샌드박스 컨테이너를 중지합니다.

      [Usage Examples]
        - task agents:sandbox:down
    cmds:
      - '{{default "docker compose -p project -f compose.yml" .COMPOSE}} stop sandbox'

  sandbox:build:
    desc: "코딩 에이전트 개발 샌드박스 이미지 빌드"
    summary: |
      샌드박스 이미지 및 의존성 환경을 캐시 없이 강제 재빌드합니다.

      [Usage Examples]
        - task agents:sandbox:build
    cmds:
      - '{{default "docker compose -p project -f compose.yml" .COMPOSE}} --profile tools build --no-cache sandbox'

  sandbox:shell:
    desc: "코딩 에이전트 개발 샌드박스 내 터미널 셸(bash) 접속"
    summary: |
      에이전트 샌드박스 컨테이너 내부 터미널 셸에 인터랙티브하게 접속합니다.

      [Usage Examples]
        - task agents:sandbox:shell
    cmds:
      - '{{default "docker compose -p project -f compose.yml" .COMPOSE}} exec -it sandbox bash'

  openbox:up:
    desc: "코딩 에이전트 개발 GUI 데스크톱(openbox) 실행"
    summary: |
      Webtop 기반 에이전트 GUI 데스크톱 컨테이너를 백그라운드로 실행하고 Traefik 라우팅을 활성화합니다.

      [Usage Examples]
        - task agents:openbox:up
    cmds:
      - '{{default "docker compose -p project -f compose.yml" .COMPOSE}} --profile tools up -d openbox'

  openbox:down:
    desc: "코딩 에이전트 개발 GUI 데스크톱 중지"
    summary: |
      에이전트 GUI 데스크톱 컨테이너를 중지합니다.

      [Usage Examples]
        - task agents:openbox:down
    cmds:
      - '{{default "docker compose -p project -f compose.yml" .COMPOSE}} stop openbox'

  openbox:build:
    desc: "코딩 에이전트 개발 GUI 데스크톱 이미지 빌드"
    summary: |
      GUI 데스크톱 이미지 및 의존성 환경을 캐시 없이 강제 재빌드합니다.

      [Usage Examples]
        - task agents:openbox:build
    cmds:
      - '{{default "docker compose -p project -f compose.yml" .COMPOSE}} --profile tools build --no-cache openbox'

  openbox:shell:
    desc: "코딩 에이전트 개발 GUI 데스크톱 내 터미널 셸(zsh) 접속"
    summary: |
      에이전트 GUI 데스크톱 컨테이너 내부 터미널 셸에 인터랙티브하게 접속합니다.

      [Usage Examples]
        - task agents:openbox:shell
    cmds:
      - '{{default "docker compose -p project -f compose.yml" .COMPOSE}} exec -it openbox zsh'
