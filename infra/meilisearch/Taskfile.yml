version: "3"

tasks:
  refresh-index:
    desc: Sync MongoDB Silver documents to Meilisearch.
    summary: |
      Sync Silver-tier documents from MongoDB to the Meilisearch search index.

      [Variables]
        - SITE: (옵션) 특정 사이트만 인덱싱

      [Usage Examples]
        - task meili:refresh-index
        - task meili:refresh-index SITE="geeknews"
    cmds:
      - "{{.COMPOSE}} run --rm {{.RUN_USER}} -v /app/node_modules -T worker npx ts-node src/scripts/meili-manager.ts {{if .SITE}}--site {{.SITE}}{{end}} {{.CLI_ARGS}}"

  index:reset:
    desc: Clear and rebuild Meilisearch index.
    summary: |
      Clear the Meilisearch index and rebuild from scratch.

      [Variables]
        - SITE: (옵션) 특정 사이트만 리셋

      [Usage Examples]
        - task meili:index:reset
        - task meili:index:reset SITE="geeknews"
    cmds:
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} -v /app/node_modules -T worker npx ts-node src/scripts/meili-manager.ts --clean {{if .SITE}}{{printf "--site %s" .SITE}}{{end}} {{.CLI_ARGS}}'

  status:
    desc: Check Meilisearch index statistics.
    summary: |
      Display Meilisearch index statistics (document count, storage size, etc.).

      [Usage Examples]
        - task meili:status
    cmds:
      - |
        {{.COMPOSE}} run --rm {{.RUN_USER}} -v /app/node_modules -T worker node -e "\
          fetch('http://meilisearch:7700/stats', { headers: { Authorization: 'Bearer superMasterKeySecret123' } })\
            .then(r => r.json())\
            .then(data => console.log(JSON.stringify(data, null, 2)))\
            .catch(err => console.error('Error fetching stats:', err.message))"
