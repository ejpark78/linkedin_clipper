version: "3"

vars:
  DB: '{{.DB | default "bronze,silver,crawler"}}'
  DUMP_DIR:
    sh: echo "{{.ROOT_DIR}}/data/backup/mongodb/$(date +%Y%m%dT%H%M%S)"

tasks:
  dump:
    desc: Back up MongoDB databases.
    summary: |
      Dump specified MongoDB databases to compressed archive files.

      [Variables]
        - DB: (옵션) 대상 DB 목록 (기본값: "bronze,silver,crawler")

      [Usage Examples]
        - task mongo:dump
        - task mongo:dump DB="bronze,silver"
    cmds:
      - mkdir -p {{.DUMP_DIR}}
      - '{{.COMPOSE}} exec -T mongodb sh -c "rm -rf /tmp/mongodb_backup && mkdir -p /tmp/mongodb_backup"'
      - |
        for db in $(echo "{{.DB}}" | tr ',' ' '); do
          {{.COMPOSE}} exec -T mongodb mongodump --db=$db --gzip --out=/tmp/mongodb_backup {{.CLI_ARGS}}
        done
      - "{{.COMPOSE}} cp mongodb:/tmp/mongodb_backup/. {{.DUMP_DIR}}"
      - "{{.COMPOSE}} exec -T mongodb rm -rf /tmp/mongodb_backup"

  restore:
    desc: Restore MongoDB backup.
    summary: |
      Restore MongoDB databases from a previous backup dump.

      [Variables]
        - BACKUP_PATH: (필수) 복원할 백업 디렉토리 경로

      [Usage Examples]
        - task mongo:restore BACKUP_PATH="backup/mongodb/20260705T120000"
    cmds:
      - |
        if [ -z "{{.BACKUP_PATH}}" ]; then
          echo "BACKUP_PATH 변수를 지정해야 합니다."
          exit 1
        fi
      - '{{.COMPOSE}} exec -T mongodb sh -c "rm -rf /tmp/mongodb_restore"'
      - "{{.COMPOSE}} cp {{.ROOT_DIR}}/data/{{.BACKUP_PATH}} mongodb:/tmp/mongodb_restore"
      - "{{.COMPOSE}} exec -T mongodb mongorestore --gzip /tmp/mongodb_restore {{.CLI_ARGS}}"
      - "{{.COMPOSE}} exec -T mongodb rm -rf /tmp/mongodb_restore"

  index:
    desc: Synchronize MongoDB indexes.
    summary: |
      Sync MongoDB index definitions (ensuring all required indexes exist).

      [Usage Examples]
        - task mongo:index
    cmds:
      - "{{.COMPOSE}} run --rm -T worker npx ts-node src/scripts/sync-indexes.ts {{.CLI_ARGS}}"

  show-columns:
    desc: Map MongoDB collection columns.
    summary: |
      Display the column/field structure of specified MongoDB collections.

      [Usage Examples]
        - task mongo:show-columns
    cmds:
      - "{{.COMPOSE}} run --rm {{.RUN_USER}} -v /app/node_modules worker npx ts-node src/scripts/show_collection_columns.ts {{.CLI_ARGS}}"
