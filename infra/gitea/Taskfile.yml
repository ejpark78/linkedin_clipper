version: '3'

env:
  NODE_OPTIONS: "--use-system-ca"

tasks:
  up:
    desc: Gitea 컨테이너 실행
    summary: |
      Gitea 컨테이너를 시작하고 헬스체크가 통과할 때까지 대기합니다.

      [Usage Examples]
        - task git:up
    cmds:
      - '{{.COMPOSE}} --profile tools up -d gitea'
      - sleep 5

  user:create:
    desc: ".env의 GITEA_ADMIN_USER/PASSWORD로 admin 계정 생성"
    summary: |
      Gitea 컨테이너 내부에 admin 계정을 생성합니다.
      이미 존재하는 계정이면 건너뜁니다.

      [Variables]
        - USERNAME: (옵션) 생성할 유저명 (미지정 시 .env의 GITEA_ADMIN_USER)
        - PASSWORD: (옵션) 비밀번호 (미지정 시 .env의 GITEA_ADMIN_PASSWORD)

      [Usage Examples]
        - task git:user:create
        - task git:user:create USERNAME="ejpark" PASSWORD="mypass"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        GITEA_USER="${USERNAME:-${GITEA_ADMIN_USER:-gitea-admin}}"
        GITEA_PASS="${PASSWORD:-${GITEA_ADMIN_PASSWORD:-admin12345}}"
        if {{.COMPOSE}} exec -T -u 1000 gitea gitea admin user list | grep -q " $GITEA_USER "; then
          echo "✅ 유저 '$GITEA_USER' 가 이미 존재합니다."
        else
          GITEA_EMAIL="${GITEA_ADMIN_EMAIL:-admin@example.com}"
          {{.COMPOSE}} exec -T -u 1000 gitea gitea admin user create --admin --username "$GITEA_USER" --password "$GITEA_PASS" --email "$GITEA_EMAIL" {{.CLI_ARGS}}
          echo "✅ 새 admin 유저 '$GITEA_USER' 가 생성되었습니다."
        fi

  user:list:
    desc: "Gitea 전체 유저 목록 조회"
    summary: |
      Gitea 컨테이너의 모든 유저를 ID/이름/이메일/Admin 여부로 출력합니다.

      [Usage Examples]
        - task git:user:list
    cmds:
      - |
        {{.COMPOSE}} exec -T -u 1000 gitea gitea admin user list {{.CLI_ARGS}}

  user:token:
    desc: "Gitea 유저의 새 API 토큰 발급"
    summary: |
      지정된 유저의 새 API 토큰을 발급하고 출력합니다.
      .env의 GITEA_ACCESS_TOKEN을 갱신하려면 --update-env 플래그를 추가하세요.

      [Variables]
        - USERNAME: (옵션) 토큰을 발급할 유저명 (미지정 시 .env의 GITEA_ADMIN_USER)
        - TOKEN_NAME: (옵션) 토큰 이름 (기본값: opencode-token-<timestamp>)

      [Usage Examples]
        - task git:user:token
        - task git:user:token USERNAME="ejpark"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        GITEA_USER="${USERNAME:-${GITEA_ADMIN_USER:-gitea-admin}}"
        GITEA_PASS="${GITEA_ADMIN_PASSWORD:-admin12345}"
        TOKEN_NAME="${TOKEN_NAME:-opencode-token-$(date +%s)}"
        GITEA_API="${GITEA_API_URL:-https://git.localhost/api/v1}"
        TOKEN=$(curl -sk -u "$GITEA_USER:$GITEA_PASS" -X POST "$GITEA_API/users/$GITEA_USER/tokens" \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$TOKEN_NAME\",\"scopes\":[\"all\"]}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha1',''))")
        if [ -n "$TOKEN" ]; then
          echo "🔑 새 토큰: $TOKEN"
          echo "   유저: $GITEA_USER"
          echo "   이름: $TOKEN_NAME"
        else
          echo "❌ 토큰 발급 실패"
          exit 1
        fi

  repo:init:
    internal: true
    desc: Gitea repo 생성 + 토큰 발급 + git remote + push
    cmds:
      - npm run gitea -w apps/agents init {{.CLI_ARGS}}

  init:
    desc: Gitea 초기 설정 (인증서 → 컨테이너 실행 → 계정 생성 → repo 생성 → push)
    summary: |
      Gitea 워크플로우를 한 번에 초기화합니다.
      1. mkcert 인증서 생성 (없을 때만)
      2. Gitea 컨테이너 실행
      3. admin 계정 생성
      4. scraper repo 생성 + API 토큰 발급 + git remote + push

      [Usage Examples]
        - task git:init
    cmds:
      - task traefik:mkcert
      - task: up
      - echo "Gitea 컨테이너가 시작되었습니다. 계정을 생성합니다..."
      - task: user:create
      - echo "계정 생성 완료. repo를 초기화합니다..."
      - task: repo:init

  down:
    desc: Stop Gitea and runner.
    summary: |
      Stop the Gitea server and its Actions runner containers.

      [Usage Examples]
        - task git:down
    cmds:
      - '{{.COMPOSE}} stop gitea gitea_runner'

  runner:up:
    desc: Start Gitea Actions runner.
    summary: |
      Start the Gitea Actions runner container for CI/CD workflows.

      [Usage Examples]
        - task git:runner:up
    cmds:
      - '{{.COMPOSE}} --profile tools up -d gitea_runner'

  repo:dump:
    desc: Gitea repo 전체 덤프 (이슈 + 위키)
    summary: |
      Gitea에 생성되어 있는 원본 리포지토리의 이슈 목록 및 위키 전체 페이지 데이터를 로컬 덤프(Dump)합니다.
      덤프 파일은 data/dumps/gitea 디렉터리에 압축 및 JSON 포맷으로 추출되어 저장됩니다.

      [Variables]
        - DUMP_PATH: 덤프 데이터가 위치할 로컬 디렉터리 경로 (기본값: "data/dumps/gitea")

      [Usage Examples]
        - task git:repo:dump
        - task git:repo:dump DUMP_PATH="data/backup/gitea"
    cmds:
      - npm run gitea -w apps/agents -- repo:dump {{.DUMP_PATH}} {{.CLI_ARGS}}

  repo:restore:
    desc: "Gitea repo 전체 복원 (이슈 + 위키)"
    summary: |
      기존에 로컬로 덤프해 둔 파일에서 Gitea 리포지토리(이슈+위키) 상태를 완전히 복구(Restore)합니다.

      [Variables]
        - DUMP_PATH: (필수) 복원 대상 덤프 파일들이 위치한 디렉터리 경로

      [Usage Examples]
        - task git:repo:restore DUMP_PATH="data/dumps/gitea/20260703"
    cmds:
      - npm run gitea -w apps/agents -- repo:restore "{{.DUMP_PATH}}" {{.CLI_ARGS}}

  issue:dump:
    desc: "Gitea 이슈를 JSON 파일로 내보내기"
    summary: |
      Gitea 서버 내부의 특정 이슈 데이터를 JSON 포맷으로 로컬 백업합니다.

      [Variables]
        - ISSUE_ID: (옵션) 백업할 특정 이슈 ID (생략 시 전체 이슈 내보내기)
        - DUMP_PATH: (옵션) 백업 디렉터리 경로 (기본값: "data/dumps/gitea")

      [Usage Examples]
        - task git:issue:dump
        - task git:issue:dump ISSUE_ID="104"
        - task git:issue:dump DUMP_PATH="data/backup" ISSUE_ID="104"
    cmds:
      - npm run gitea -w apps/agents -- issue:dump {{.DUMP_PATH}} {{.ISSUE_ID}} {{.CLI_ARGS}}

  issue:restore:
    desc: "JSON 덤프 파일에서 Gitea 이슈 복원"
    summary: |
      로컬에 JSON 포맷으로 백업해둔 백업 파일에서 Gitea 이슈 목록 및 상세 상태를 복원합니다.

      [Variables]
        - FILE_PATH: (필수) 복원할 Gitea 이슈 JSON 파일 경로

      [Usage Examples]
        - task git:issue:restore FILE_PATH="data/dumps/gitea/issues.json"
    requires:
      vars: [FILE_PATH]
    cmds:
      - npm run gitea -w apps/agents -- issue:restore "{{.FILE_PATH}}" {{.CLI_ARGS}}

  wiki:init:
    desc: "Gitea wiki 저장소 초기화 (로컬 마크다운 → Gitea wiki push)"
    summary: |
      Gitea repo wiki를 활성화하고 로컬 마크다운 파일들을 wiki 저장소에 push합니다.

      [Variables]
        - FROM_PATH: (옵션) wiki로 push할 로컬 마크다운 디렉토리 (미지정 시 Home.md만 생성)

      [Usage Examples]
        - task git:wiki:init
        - task git:wiki:init FROM_PATH="data/docs/wiki"
    cmds:
      - npm run gitea -w apps/agents -- wiki:init {{.FROM_PATH}} {{.CLI_ARGS}}

  wiki:dump:
    desc: "Gitea wiki 페이지 로컬로 내려받기"
    summary: |
      Gitea wiki 저장소(.wiki.git)를 로컬 디렉토리에 clone합니다.

      [Variables]
        - DUMP_PATH: (옵션) wiki를 저장할 디렉토리 (기본값: data/dumps/gitea)

      [Usage Examples]
        - task git:wiki:dump
    cmds:
      - npm run gitea -w apps/agents -- wiki:dump {{.DUMP_PATH}} {{.CLI_ARGS}}

  wiki:restore:
    desc: "로컬 wiki를 Gitea에 복원"
    summary: |
      로컬에 clone된 wiki 저장소를 Gitea에 push하여 복원합니다.

      [Variables]
        - WIKI_PATH: (필수) 로컬 wiki 저장소 디렉토리 경로

      [Usage Examples]
        - task git:wiki:restore WIKI_PATH="data/dumps/gitea/wiki"
    cmds:
      - npm run gitea -w apps/agents -- wiki:restore "{{.WIKI_PATH}}" {{.CLI_ARGS}}

  commit:
    desc: Commit changes through the project commit helper.
    summary: |
      Commit modified changes.

      [Usage Examples]
        - task git:commit
    cmds:
      - npm run commit -w apps/agents -- {{.CLI_ARGS}}

  push:
    desc: Push changes through the project push helper.
    summary: |
      Push committed changes.

      [Usage Examples]
        - task git:push
    cmds:
      - npm run push -w apps/agents -- {{.CLI_ARGS}}

  merge:
    desc: "현재 브랜치를 develop → main 순으로 병합"
    summary: |
      현재 브랜치를 develop에 병합한 후, develop을 main에 병합합니다.
      브랜치 타입과 무관하게 항상 양쪽(main + develop)에 반영됩니다.

      [Variables]
        - BRANCH: (옵션) 병합할 브랜치명 (미지정 시 현재 브랜치)

      [Usage Examples]
        - task git:merge
        - task git:merge BRANCH="feature/146-taskfile-refactor"
    cmds:
      - |
        BRANCH="{{.BRANCH}}"
        if [ -z "$BRANCH" ]; then
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
        fi
        echo "🔀 Merging $BRANCH → develop → main"
        git checkout develop && git pull github develop && git merge "$BRANCH" --no-ff {{.CLI_ARGS}}
        git checkout main && git pull github main && git merge develop --no-ff {{.CLI_ARGS}}
        git checkout develop
        echo "✅ Merge 완료: $BRANCH → develop → main (develop으로 복귀)"

  prune:
    desc: "Merge된 feature 브랜치 및 원격 ref 정리"
    summary: |
      develop에 병합된 로컬 feature/* 브랜치를 삭제하고
      원격 저장소의 사라진 브랜치 참조(ref)를 정리합니다.

      [Usage Examples]
        - task git:prune
    cmds:
      - git checkout develop
      - git pull github develop
      - git branch --merged | grep -E 'feature/|hotfix/' | xargs git branch -d
      - git fetch --prune github

  issue:save:
    desc: "현재 세션 컨텍스트 메모리를 Gitea 이슈로 저장"
    summary: |
      오늘 세션의 커밋 내역과 변경 통계를 Gitea 이슈에 저장합니다.
      Ollama(gemma4:e4b-mlx)가 자동으로 Decisions 섹션을 추론합니다.

      [Usage Examples]
        - task git:issue:save
    cmds:
      - npm run gitea -w apps/agents issue:save

  token:
    desc: Gitea API 토큰 생성 (GITEA_ADMIN_USERNAME/PASSWORD 필요)
    summary: |
      Gitea 관리자 계정으로 API 토큰을 생성합니다.

      [Usage Examples]
        - task git:token
    cmds:
      - npm run gitea -w apps/agents generate-token

  token:tea:
    desc: Generate a Gitea API token through tea.
    summary: |
      Generate a Gitea API token using the tea interactive CLI tool.

      [Usage Examples]
        - task git:token:tea
    cmds:
      - npm run gitea -w apps/agents generate-token-tea

  issue:new:
    desc: "새 Gitea 이슈 생성"
    summary: |
      새 Gitea 이슈를 생성합니다.

      [Variables]
        - TITLE: (필수) 생성할 이슈의 제목
        - BODY: (필수) 이슈 본문 내용 (개행은 [br] 기호로 변환 권장)

      [Usage Examples]
        - task git:issue:new TITLE="이슈 제목" BODY="상세 내용[br]두번째 줄"
    cmds:
      - npm run gitea -w apps/agents -- create-issue "{{.TITLE}}" "{{.BODY}}" {{.CLI_ARGS}}

  issue:update:
    desc: "Gitea 이슈 제목/본문 수정"
    summary: |
      기존 Gitea 이슈의 제목과 본문을 수정합니다.

      [Variables]
        - ISSUE_ID: (필수) 대상 이슈 ID 번호 (예: 104)
        - TITLE: (필수) 새로운 이슈 제목
        - BODY: (필수) 새로운 이슈 본문

      [Usage Examples]
        - task git:issue:update ISSUE_ID="104" TITLE="수정된 제목" BODY="수정된 내용"
    cmds:
      - npm run gitea -w apps/agents -- update-issue "{{.ISSUE_ID}}" "{{.TITLE}}" "{{.BODY}}" {{.CLI_ARGS}}

  issue:comment:new:
    desc: "Gitea 이슈에 댓글 등록"
    summary: |
      Gitea 이슈에 새 댓글을 등록합니다.

      [Variables]
        - ISSUE_ID: (필수) 대상 이슈 ID 번호
        - BODY: (필수) 댓글 본문 (개행은 [br] 기호 활용)

      [Usage Examples]
        - task git:issue:comment:new ISSUE_ID="104" BODY="진행 경과 보고[br]- 완료"
    cmds:
      - npm run gitea -w apps/agents -- comment "{{.ISSUE_ID}}" "{{.BODY}}" {{.CLI_ARGS}}

  issue:comment:update:
    desc: "Gitea 이슈 댓글 수정"
    summary: |
      기존 Gitea 이슈 댓글의 내용을 수정합니다.

      [Variables]
        - COMMENT_ID: (필수) 대상 댓글 ID 번호 (예: 2642)
        - BODY: (필수) 새로운 댓글 본문

      [Usage Examples]
        - task git:issue:comment:update COMMENT_ID="2642" BODY="수정된 댓글 내용"
    cmds:
      - npm run gitea -w apps/agents -- update-comment "{{.COMMENT_ID}}" "{{.BODY}}" {{.CLI_ARGS}}

  issue:close:
    desc: "Gitea 이슈 마감"
    summary: |
      활성 Gitea 이슈를 마감(Closed) 처리합니다.

      [Variables]
        - ISSUE_ID: (필수) 닫으려는 이슈 ID 번호

      [Usage Examples]
        - task git:issue:close ISSUE_ID="142"
    cmds:
      - |
        if [ -z "{{.ISSUE_ID}}" ]; then
          echo "❌ ISSUE_ID가 필요합니다. 사용법: task git:issue:close ISSUE_ID=\"142\""
          exit 1
        fi
        npm run gitea -w apps/agents -- close-issue "{{.ISSUE_ID}}" {{.CLI_ARGS}}

  issue:reopen:
    desc: "Gitea 이슈 재오픈"
    summary: |
      마감된 Gitea 이슈를 다시 엽니다(Reopen).

      [Variables]
        - ISSUE_ID: (필수) 다시 열려는 이슈 ID 번호

      [Usage Examples]
        - task git:issue:reopen ISSUE_ID="142"
    cmds:
      - |
        if [ -z "{{.ISSUE_ID}}" ]; then
          echo "❌ ISSUE_ID가 필요합니다. 사용법: task git:issue:reopen ISSUE_ID=\"142\""
          exit 1
        fi
        npm run gitea -w apps/agents -- reopen-issue "{{.ISSUE_ID}}" {{.CLI_ARGS}}

  issue:label:
    desc: "기존 전체 이슈에 rule-based 라벨 소급 적용"
    summary: |
      기존 이슈의 제목 prefix(feat/fix/refactor 등)와 변경 파일 경로를 분석하여
      Type + Area 라벨을 소급 적용합니다.

      [Usage Examples]
        - task git:issue:label
    cmds:
      - npm run gitea -w apps/agents retroactive-labels

  issue:list:
    desc: "Gitea 이슈 목록 조회"
    summary: |
      저장소의 이슈 목록을 번호/작성일/제목으로 출력합니다.
      기본값은 최근 열린(open) 이슈 20개를 보여줍니다.

      [Variables]
        - STATE: (옵션) 필터 상태 (open, closed, all / 기본값: open)
        - LIMIT: (옵션) 표시할 개수 (기본값: 20)

      [Usage Examples]
        - task git:issue:list
        - task git:issue:list STATE="all"
        - task git:issue:list STATE="closed" LIMIT="5"
    cmds:
      - npm run gitea -w apps/agents -- list-issues "{{.STATE}}" "{{.LIMIT}}" {{.CLI_ARGS}}

  issue:show:
    desc: "Gitea 이슈 본문 조회"
    summary: |
      Gitea 이슈의 본문 내용과 상태를 출력합니다.

      [Variables]
        - ISSUE_ID: (필수) 조회할 이슈 ID 번호

      [Usage Examples]
        - task git:issue:show ISSUE_ID="104"
    cmds:
      - npm run gitea -w apps/agents -- show-issue "{{.ISSUE_ID}}" {{.CLI_ARGS}}
