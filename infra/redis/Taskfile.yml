version: '3'

tasks:
  config:
    desc: Show Redis Compose config.
    summary: |
      Print the resolved Docker Compose configuration for Redis.

      [Usage Examples]
        - task redis:config
    cmds:
      - '{{.COMPOSE}} config'
  up:
    desc: Start Redis server.
    summary: |
      Start the Redis server container.

      [Usage Examples]
        - task redis:up
    cmds:
      - '{{.COMPOSE}} up -d redis'
  gui:up:
    desc: Start RedisInsight web UI.
    summary: |
      Start the RedisInsight web-based Redis management UI.

      [Usage Examples]
        - task redis:gui:up
    cmds:
      - '{{.COMPOSE}} --profile tools up -d redisinsight'
  down:
    desc: Stop Redis and RedisInsight.
    summary: |
      Stop both Redis and RedisInsight containers.

      [Usage Examples]
        - task redis:down
    cmds:
      - '{{.COMPOSE}} stop redis redisinsight'


