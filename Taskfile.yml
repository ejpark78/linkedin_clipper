version: "3"

vars:
  PROJECT:
    sh: grep -s '^PROJECT_NAME=' .env 2>/dev/null | cut -d= -f2 || echo "scraper"
  ROOT_DIR:
    sh: pwd
  PROJECT_PATH:
    sh: grep -s '^PROJECT_PATH=' .env 2>/dev/null | cut -d= -f2 || pwd
  COMPOSE: PROJECT_PATH={{.PROJECT_PATH}} docker compose -p {{.PROJECT}} --project-directory {{.ROOT_DIR}} -f {{.ROOT_DIR}}/compose.yml
  RUN_USER:
    sh: echo "--user $(id -u):$(id -g)"
  ENV_COMMON: -e TS_NODE_PROJECT=tsconfig.json

includes:
  ebook:
    taskfile: ./projects/ebook/Taskfile.yml
    dir: .
  obsidian:
    taskfile: ./agents/docker/obsidian/Taskfile.yml
    dir: .
  crawler:
    taskfile: ./projects/crawler/Taskfile.yml
    dir: .
  wiki:
    taskfile: ./projects/wiki/Taskfile.yml
    dir: .
  agents:
    taskfile: ./agents/Taskfile.yml
    dir: .
  joplin:
    taskfile: ./projects/wiki/docker/joplin/Taskfile.yml
    dir: .
  git:
    taskfile: ./agents/docker/gitea/Taskfile.yml
    dir: .
  meili:
    taskfile: ./infra/meilisearch/Taskfile.yml
    dir: .
  mongo:
    taskfile: ./infra/mongodb/Taskfile.yml
    dir: .
  traefik:
    taskfile: ./agents/docker/traefik/Taskfile.yml
    dir: .
  leantime:
    taskfile: ./agents/docker/leantime/Taskfile.yml
    dir: .
tasks:
  build:
    desc: "Build Docker images. Usage: task build [-- <service_names>]"
    summary: |
      Build Docker images for specified services (or all if omitted).
      Uses --no-cache to force a fresh build.

      [Variables]
        - CLI_ARGS:   (옵션) docker compose build에 전달할 추가 인자 (서비스명 등)
        - ARCH:       (옵션) sandbox 빌드 플랫폼 아키텍처 (amd64 | arm64, 기본값: arm64)
                      agents/docker/sandbox/compose.yml 의 platform: 및 image: 태그에 적용됨

      [Usage Examples]
        # 기본 전체 빌드 (native)
        - task build

        # 특정 서비스만 native 빌드
        - task build -- traefik gitea

        # sandbox amd64 빌드 (태그: agents/sandbox:amd64, platform: linux/amd64)
        - ARCH=amd64 task build -- sandbox

        # sandbox arm64 빌드 (태그: agents/sandbox:arm64, platform: linux/arm64)
        - ARCH=arm64 task build -- sandbox
          or just: task build -- sandbox
    cmds:
      - "{{.COMPOSE}} build --no-cache {{.CLI_ARGS}}"

  up:
    desc: "Start containers. Usage: task up [-- <service_names>]"
    summary: |
      Start Docker containers in detached mode.
      If no service name is given, all services defined in compose.yml are started.

      [Variables]
        - CLI_ARGS:   (옵션) docker compose up에 전달할 추가 인자 (서비스명 등)
        - ARCH:       (옵션) sandbox 실행 플랫폼 아키텍처 (amd64 | arm64, 기본값: arm64)
                      agents/docker/sandbox/compose.yml 의 platform: 및 image: 태그에 적용됨

      [Usage Examples]
        - task up
        - task up -- traefik gitea
        - ARCH=amd64 task up -- sandbox   (amd64, 이미지: agents/sandbox:amd64)
        - ARCH=arm64 task up -- sandbox   (arm64, 이미지: agents/sandbox:arm64)
    cmds:
      - "{{.COMPOSE}} up -d {{.CLI_ARGS}}"

  down:
    desc: "Stop containers. Usage: task down [-- <service_names>]"
    summary: |
      Stop running Docker containers without removing them.
      If no service name is given, all services are stopped.

      [Variables]
        - CLI_ARGS: (옵션) docker compose stop에 전달할 추가 인자 (서비스명 등)

      [Usage Examples]
        - task down
        - task down -- traefik
    cmds:
      - "{{.COMPOSE}} stop {{.CLI_ARGS}}"

  restart:
    desc: "Restart containers. Usage: task restart [-- <service_names>]"
    summary: |
      Restart running Docker containers.
      If no service name is given, all services are restarted.

      [Variables]
        - CLI_ARGS: (옵션) docker compose restart에 전달할 추가 인자 (서비스명 등)

      [Usage Examples]
        - task restart
        - task restart -- traefik
    cmds:
      - "{{.COMPOSE}} restart {{.CLI_ARGS}}"

  logs:
    desc: "View container logs. Usage: task logs [-- <service_names>]"
    summary: |
      Tail and view logs from running Docker containers.
      If no service name is given, logs from all services are shown.

      [Variables]
        - CLI_ARGS: (옵션) docker compose logs에 전달할 추가 인자 (서비스명 등)

      [Usage Examples]
        - task logs
        - task logs -- traefik
        - task logs -- --tail=50 traefik
    cmds:
      - "{{.COMPOSE}} logs -f {{.CLI_ARGS}}"

  svc:
    desc: "List all available services. Usage: task svc"
    summary: |
      List all Docker Compose services defined in compose.yml.

      [Usage Examples]
        - task svc
    cmds:
      - "{{.COMPOSE}} config --services"

  config:
    desc: Validate the full Docker Compose graph.
    summary: |
      Validate the full Docker Compose graph and print the resolved,
      merged service configuration including all environment variables.

      [Usage Examples]
        - task config
    cmds:
      - "{{.COMPOSE}} config"
  ps:
    desc: "List running containers. Usage: task ps"
    summary: |
      Display all running Docker Compose containers with name, service, and image columns.

      [Usage Examples]
        - task ps
    cmds:
      - '{{.COMPOSE}} ps --format "table {{`{{.Name}}`}}\t{{`{{.Service}}`}}\t{{`{{.Image}}`}}"'

