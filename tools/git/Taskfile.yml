version: '3'

tasks:
  up:
    desc: Gitea 컨테이너 실행 및 관리자 계정 확인
    summary: |
      Gitea 컨테이너를 시작하고 로컬 관리자 계정(gitea-admin)이 존재하는지 확인합니다.

      [Usage Examples]
        - task git:up
    cmds:
      - '{{.COMPOSE}} --profile tools up -d gitea'
      - sleep 5
      - |
        if ! {{.COMPOSE}} exec -T -u 1000 gitea gitea admin user list | grep -q "gitea-admin"; then
          {{.COMPOSE}} exec -T -u 1000 gitea gitea admin user create --admin --username gitea-admin --password admin12345 --email admin@example.com || true
        fi

  repo:init:
    internal: true
    desc: Gitea repo 생성 + 토큰 발급 + git remote + push
    cmds:
      - npm run gitea init

  init:
    desc: Gitea 초기 설정 (인증서 → 컨테이너 실행 → repo 생성 → 토큰 발급 → push)
    summary: |
      Gitea 워크플로우를 한 번에 초기화합니다.
      1. mkcert 인증서 생성 (없을 때만)
      2. Gitea 컨테이너 실행 및 관리자 계정 생성
      3. scraper repo 생성 + API 토큰 발급 + git remote + push

      [Usage Examples]
        - task git:init
    cmds:
      - task: traefik:mkcert
      - task: up
      - echo "Gitea 컨테이너가 시작되었습니다. 초기화를 계속합니다..."
      - task: repo:init

  down:
    desc: Stop Gitea and runner.
    cmds:
      - '{{.COMPOSE}} stop gitea gitea_runner'

  runner:up:
    desc: Start Gitea Actions runner.
    cmds:
      - '{{.COMPOSE}} --profile tools up -d gitea_runner'

  commit:
    desc: Commit changes through the project commit helper.
    summary: |
      Interactively run local lint, type-check, and AI review checks before committing.

      [Usage Examples]
        - task git:commit
    cmds:
      - npm run commit

  push:
    desc: Push changes through the project push helper.
    summary: |
      Push locally committed branches and synchronize issue tracking tags with Gitea.

      [Usage Examples]
        - task git:push
    cmds:
      - npm run push

  token:
    desc: Gitea API 토큰 생성 (GITEA_ADMIN_USERNAME/PASSWORD 필요)
    summary: |
      Gitea 관리자 계정으로 API 토큰을 생성합니다.

      [Usage Examples]
        - task git:token
    cmds:
      - npm run gitea:token

  token:tea:
    desc: Generate a Gitea API token through tea.
    summary: |
      Generate a Gitea API token using the tea interactive CLI tool.

      [Usage Examples]
        - task git:token:tea
    cmds:
      - npm run gitea:token:tea

  issue:new:
    desc: "새 Gitea 이슈 생성"
    summary: |
      새 Gitea 이슈를 생성합니다.

      [Variables]
        - TITLE: (필수) 생성할 이슈의 제목
        - BODY: (필수) 이슈 본문 내용 (개행은 [br] 기호로 변환 권장)

      [Usage Examples]
        - task git:issue:new TITLE="이슈 제목" BODY="상세 내용[br]두번째 줄"
    cmds:
      - npm run gitea create-issue "{{.TITLE}}" "{{.BODY}}"

  issue:update:
    desc: "Gitea 이슈 제목/본문 수정"
    summary: |
      기존 Gitea 이슈의 제목과 본문을 수정합니다.

      [Variables]
        - ISSUE_ID: (필수) 대상 이슈 ID 번호 (예: 104)
        - TITLE: (필수) 새로운 이슈 제목
        - BODY: (필수) 새로운 이슈 본문

      [Usage Examples]
        - task git:issue:update ISSUE_ID="104" TITLE="수정된 제목" BODY="수정된 내용"
    cmds:
      - npm run gitea update-issue "{{.ISSUE_ID}}" "{{.TITLE}}" "{{.BODY}}"

  issue:comment:new:
    desc: "Gitea 이슈에 댓글 등록"
    summary: |
      Gitea 이슈에 새 댓글을 등록합니다.

      [Variables]
        - ISSUE_ID: (필수) 대상 이슈 ID 번호
        - BODY: (필수) 댓글 본문 (개행은 [br] 기호 활용)

      [Usage Examples]
        - task git:issue:comment:new ISSUE_ID="104" BODY="진행 경과 보고[br]- 완료"
    cmds:
      - npm run gitea comment "{{.ISSUE_ID}}" "{{.BODY}}"

  issue:comment:update:
    desc: "Gitea 이슈 댓글 수정"
    summary: |
      기존 Gitea 이슈 댓글의 내용을 수정합니다.

      [Variables]
        - COMMENT_ID: (필수) 대상 댓글 ID 번호 (예: 2642)
        - BODY: (필수) 새로운 댓글 본문

      [Usage Examples]
        - task git:issue:comment:update COMMENT_ID="2642" BODY="수정된 댓글 내용"
    cmds:
      - npm run gitea update-comment "{{.COMMENT_ID}}" "{{.BODY}}"

  issue:close:
    desc: "Gitea 이슈 마감"
    summary: |
      활성 Gitea 이슈를 마감(Closed) 처리합니다.

      [Variables]
        - ISSUE_ID: (필수) 닫으려는 이슈 ID 번호

      [Usage Examples]
        - task git:issue:close ISSUE_ID="142"
    cmds:
      - npm run gitea close-issue "{{.ISSUE_ID}}"

  issue:reopen:
    desc: "Gitea 이슈 재오픈"
    summary: |
      마감된 Gitea 이슈를 다시 엽니다(Reopen).

      [Variables]
        - ISSUE_ID: (필수) 다시 열려는 이슈 ID 번호

      [Usage Examples]
        - task git:issue:reopen ISSUE_ID="142"
    cmds:
      - npm run gitea reopen-issue "{{.ISSUE_ID}}"

  issue:show:
    desc: "Gitea 이슈 본문 조회"
    summary: |
      Gitea 이슈의 본문 내용과 상태를 출력합니다.

      [Variables]
        - ISSUE_ID: (필수) 조회할 이슈 ID 번호

      [Usage Examples]
        - task git:issue:show ISSUE_ID="104"
    cmds:
      - npm run gitea show-issue "{{.ISSUE_ID}}"
