version: '3'

env:
  NODE_OPTIONS: "--use-system-ca"

tasks:
  up:
    desc: Gitea 컨테이너 실행 및 관리자 계정 확인
    summary: |
      Gitea 컨테이너를 시작하고 로컬 관리자 계정(gitea-admin)이 존재하는지 확인합니다.

      [Usage Examples]
        - task git:up
    cmds:
      - '{{.COMPOSE}} --profile tools up -d gitea'
      - sleep 5
      - |
        GITEA_USER="${GITEA_ADMIN_USER:-gitea-admin}"
        GITEA_PASS="${GITEA_ADMIN_PASSWORD:-admin12345}"
        if ! {{.COMPOSE}} exec -T -u 1000 gitea gitea admin user list | grep -q "$GITEA_USER"; then
          {{.COMPOSE}} exec -T -u 1000 gitea gitea admin user create --admin --username "$GITEA_USER" --password "$GITEA_PASS" --email admin@example.com || true
        fi

  repo:init:
    internal: true
    desc: Gitea repo 생성 + 토큰 발급 + git remote + push
    cmds:
      - npm run gitea init

  init:
    desc: Gitea 초기 설정 (인증서 → 컨테이너 실행 → repo 생성 → 토큰 발급 → push)
    summary: |
      Gitea 워크플로우를 한 번에 초기화합니다.
      1. mkcert 인증서 생성 (없을 때만)
      2. Gitea 컨테이너 실행 및 관리자 계정 생성
      3. scraper repo 생성 + API 토큰 발급 + git remote + push

      [Usage Examples]
        - task git:init
    cmds:
      - task traefik:mkcert
      - task: up
      - echo "Gitea 컨테이너가 시작되었습니다. 초기화를 계속합니다..."
      - task: repo:init

  down:
    desc: Stop Gitea and runner.
    cmds:
      - '{{.COMPOSE}} stop gitea gitea_runner'

  runner:up:
    desc: Start Gitea Actions runner.
    cmds:
      - '{{.COMPOSE}} --profile tools up -d gitea_runner'

  repo:dump:
    desc: "Gitea repo 전체 덤프 (이슈 + 위키)"
    summary: |
      Gitea 저장소의 이슈(댓글 포함)와 위키를 로컬 JSON/Git으로 내보냅니다.

      [Variables]
        - DUMP_PATH: (옵션) 덤프 출력 디렉토리 (기본값: data/dumps/gitea)

      [Usage Examples]
        - task git:repo:dump
        - task git:repo:dump DUMP_PATH="data/backup/gitea"
    cmds:
      - npm run gitea repo:dump {{.DUMP_PATH}}

  repo:restore:
    desc: "Gitea repo 전체 복원 (이슈 + 위키)"
    summary: |
      덤프 데이터에서 이슈와 위키를 Gitea에 복원합니다.

      [Variables]
        - DUMP_PATH: (필수) 덤프 데이터 디렉토리 경로

      [Usage Examples]
        - task git:repo:restore DUMP_PATH="data/dumps/gitea/20260703"
    cmds:
      - npm run gitea repo:restore "{{.DUMP_PATH}}"

  issue:dump:
    desc: "Gitea 이슈를 JSON 파일로 내보내기"
    summary: |
      Gitea 이슈(본문 + 댓글)를 로컬 JSON 파일로 덤프합니다.

      [Variables]
        - DUMP_PATH: (옵션) 덤프 출력 디렉토리 (기본값: data/dumps/gitea)
        - ISSUE_ID: (옵션) 특정 이슈 ID (미지정 시 전체)

      [Usage Examples]
        - task git:issue:dump
        - task git:issue:dump ISSUE_ID="104"
        - task git:issue:dump DUMP_PATH="data/backup" ISSUE_ID="104"
    cmds:
      - npm run gitea issue:dump {{.DUMP_PATH}} {{.ISSUE_ID}}

  issue:restore:
    desc: "JSON 덤프 파일에서 Gitea 이슈 복원"
    summary: |
      덤프 파일에서 이슈와 댓글을 읽어 Gitea에 재생성합니다.

      [Variables]
        - FILE_PATH: (필수) 덤프 JSON 파일 경로

      [Usage Examples]
        - task git:issue:restore FILE_PATH="data/dumps/gitea/issues.json"
    requires:
      vars: [FILE_PATH]
    cmds:
      - npm run gitea issue:restore "{{.FILE_PATH}}"

  wiki:init:
    desc: "Gitea wiki 저장소 초기화 (로컬 마크다운 → Gitea wiki push)"
    summary: |
      Gitea repo wiki를 활성화하고 로컬 마크다운 파일들을 wiki 저장소에 push합니다.

      [Variables]
        - FROM_PATH: (옵션) wiki로 push할 로컬 마크다운 디렉토리 (미지정 시 Home.md만 생성)

      [Usage Examples]
        - task git:wiki:init
        - task git:wiki:init FROM_PATH="data/docs/wiki"
    cmds:
      - npm run gitea wiki:init {{.FROM_PATH}}

  wiki:dump:
    desc: "Gitea wiki 페이지 로컬로 내려받기"
    summary: |
      Gitea wiki 저장소(.wiki.git)를 로컬 디렉토리에 clone합니다.

      [Variables]
        - DUMP_PATH: (옵션) wiki를 저장할 디렉토리 (기본값: data/dumps/gitea)

      [Usage Examples]
        - task git:wiki:dump
    cmds:
      - npm run gitea wiki:dump {{.DUMP_PATH}}

  wiki:restore:
    desc: "로컬 wiki를 Gitea에 복원"
    summary: |
      로컬에 clone된 wiki 저장소를 Gitea에 push하여 복원합니다.

      [Variables]
        - WIKI_PATH: (필수) 로컬 wiki 저장소 디렉토리 경로

      [Usage Examples]
        - task git:wiki:restore WIKI_PATH="data/dumps/gitea/wiki"
    cmds:
      - npm run gitea wiki:restore "{{.WIKI_PATH}}"

  commit:
    desc: Commit changes through the project commit helper.
    summary: |
      Interactively run local lint, type-check, and AI review checks before committing.

      [Usage Examples]
        - task git:commit
    cmds:
      - npm run commit

  push:
    desc: Push changes through the project push helper.
    summary: |
      Push locally committed branches and synchronize issue tracking tags with Gitea.

      [Usage Examples]
        - task git:push
    cmds:
      - npm run push

  merge:
    desc: "현재 브랜치를 develop/main에 병합"
    summary: |
      현재 브랜치 타입에 따라 자동 병합합니다.
      - feature/* → develop
      - hotfix/* → main → develop

      [Variables]
        - BRANCH: (옵션) 병합할 브랜치명 (미지정 시 현재 브랜치)

      [Usage Examples]
        - task git:merge
        - task git:merge BRANCH="feature/146-taskfile-refactor"
    cmds:
      - |
        BRANCH="{{.BRANCH}}"
        if [ -z "$BRANCH" ]; then
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
        fi
        echo "🔀 Merging $BRANCH..."
        case "$BRANCH" in
          feature/*)
            git checkout develop && git pull github develop && git merge "$BRANCH" --no-ff
            ;;
          hotfix/*)
            git checkout main && git pull github main && git merge "$BRANCH" --no-ff
            git checkout develop && git pull github develop && git merge main --no-ff
            ;;
          *)
            echo "❌ 브랜치 패턴이 feature/* 또는 hotfix/* 가 아닙니다: $BRANCH"
            exit 1
            ;;
        esac
        echo "✅ Merge 완료: $BRANCH"

  prune:
    desc: "Merge된 feature 브랜치 및 원격 ref 정리"
    summary: |
      develop에 병합된 로컬 feature/* 브랜치를 삭제하고
      원격 저장소의 사라진 브랜치 참조(ref)를 정리합니다.

      [Usage Examples]
        - task git:prune
    cmds:
      - git checkout develop
      - git pull github develop
      - git branch --merged | grep -E 'feature/|hotfix/' | xargs git branch -d
      - git fetch --prune github

  issue:save:
    desc: "현재 세션 컨텍스트 메모리를 Gitea 이슈로 저장"
    summary: |
      오늘 세션의 커밋 내역과 변경 통계를 Gitea 이슈에 저장합니다.
      Ollama(gemma4:e4b-mlx)가 자동으로 Decisions 섹션을 추론합니다.

      [Usage Examples]
        - task git:issue:save
    cmds:
      - npm run gitea issue:save

  token:
    desc: Gitea API 토큰 생성 (GITEA_ADMIN_USERNAME/PASSWORD 필요)
    summary: |
      Gitea 관리자 계정으로 API 토큰을 생성합니다.

      [Usage Examples]
        - task git:token
    cmds:
      - npm run gitea:token

  token:tea:
    desc: Generate a Gitea API token through tea.
    summary: |
      Generate a Gitea API token using the tea interactive CLI tool.

      [Usage Examples]
        - task git:token:tea
    cmds:
      - npm run gitea:token:tea

  issue:new:
    desc: "새 Gitea 이슈 생성"
    summary: |
      새 Gitea 이슈를 생성합니다.

      [Variables]
        - TITLE: (필수) 생성할 이슈의 제목
        - BODY: (필수) 이슈 본문 내용 (개행은 [br] 기호로 변환 권장)

      [Usage Examples]
        - task git:issue:new TITLE="이슈 제목" BODY="상세 내용[br]두번째 줄"
    cmds:
      - npm run gitea create-issue "{{.TITLE}}" "{{.BODY}}"

  issue:update:
    desc: "Gitea 이슈 제목/본문 수정"
    summary: |
      기존 Gitea 이슈의 제목과 본문을 수정합니다.

      [Variables]
        - ISSUE_ID: (필수) 대상 이슈 ID 번호 (예: 104)
        - TITLE: (필수) 새로운 이슈 제목
        - BODY: (필수) 새로운 이슈 본문

      [Usage Examples]
        - task git:issue:update ISSUE_ID="104" TITLE="수정된 제목" BODY="수정된 내용"
    cmds:
      - npm run gitea update-issue "{{.ISSUE_ID}}" "{{.TITLE}}" "{{.BODY}}"

  issue:comment:new:
    desc: "Gitea 이슈에 댓글 등록"
    summary: |
      Gitea 이슈에 새 댓글을 등록합니다.

      [Variables]
        - ISSUE_ID: (필수) 대상 이슈 ID 번호
        - BODY: (필수) 댓글 본문 (개행은 [br] 기호 활용)

      [Usage Examples]
        - task git:issue:comment:new ISSUE_ID="104" BODY="진행 경과 보고[br]- 완료"
    cmds:
      - npm run gitea comment "{{.ISSUE_ID}}" "{{.BODY}}"

  issue:comment:update:
    desc: "Gitea 이슈 댓글 수정"
    summary: |
      기존 Gitea 이슈 댓글의 내용을 수정합니다.

      [Variables]
        - COMMENT_ID: (필수) 대상 댓글 ID 번호 (예: 2642)
        - BODY: (필수) 새로운 댓글 본문

      [Usage Examples]
        - task git:issue:comment:update COMMENT_ID="2642" BODY="수정된 댓글 내용"
    cmds:
      - npm run gitea update-comment "{{.COMMENT_ID}}" "{{.BODY}}"

  issue:close:
    desc: "Gitea 이슈 마감"
    summary: |
      활성 Gitea 이슈를 마감(Closed) 처리합니다.

      [Variables]
        - ISSUE_ID: (필수) 닫으려는 이슈 ID 번호

      [Usage Examples]
        - task git:issue:close ISSUE_ID="142"
    cmds:
      - npm run gitea close-issue "{{.ISSUE_ID}}"

  issue:reopen:
    desc: "Gitea 이슈 재오픈"
    summary: |
      마감된 Gitea 이슈를 다시 엽니다(Reopen).

      [Variables]
        - ISSUE_ID: (필수) 다시 열려는 이슈 ID 번호

      [Usage Examples]
        - task git:issue:reopen ISSUE_ID="142"
    cmds:
      - npm run gitea reopen-issue "{{.ISSUE_ID}}"

  issue:show:
    desc: "Gitea 이슈 본문 조회"
    summary: |
      Gitea 이슈의 본문 내용과 상태를 출력합니다.

      [Variables]
        - ISSUE_ID: (필수) 조회할 이슈 ID 번호

      [Usage Examples]
        - task git:issue:show ISSUE_ID="104"
    cmds:
      - npm run gitea show-issue "{{.ISSUE_ID}}"
