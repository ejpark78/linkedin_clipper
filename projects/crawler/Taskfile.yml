version: '3'

tasks:
  login:
    desc: Log into a browser-backed site session.
    summary: |
      Log into a Playwright browser-backed site session to store authentication state.

      [Variables]
        - SITE: (옵션) 대상 사이트 (기본값: "linkedin")

      [Usage Examples]
        - task crawler:login SITE="linkedin"
    cmds:
      - npx ts-node src/sites/linkedin/Crawler.ts --site {{.SITE | default "linkedin"}} login {{.CLI_ARGS}}

  open:
    desc: Open the Playwright browser helper.
    summary: |
      Open Playwright in non-headless/headed mode to inspect pages or debug sessions.

      [Variables]
        - SITE: (옵션) 대상 사이트 (기본값: "linkedin")

      [Usage Examples]
        - task crawler:open SITE="linkedin"
    cmds:
      - SITE={{.SITE | default "linkedin"}} npx ts-node src/tools/browser/open.ts {{.CLI_ARGS}}

  logout:
    desc: Remove a browser-backed site session.
    summary: |
      Remove stored authentication credentials for a given site session.

      [Variables]
        - SITE: (옵션) 대상 사이트 (기본값: "linkedin")

      [Usage Examples]
        - task crawler:logout SITE="linkedin"
    cmds:
      - rm -f {{.ROOT_DIR}}/data/sessions/{{.SITE | default "linkedin"}}.json

  queue:clear:
    desc: Clear crawler job queue.
    summary: |
      Remove all pending jobs from the crawler queue.

      [Usage Examples]
        - task crawler:queue:clear
    cmds:
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} worker npm run queue:clear -- {{.CLI_ARGS}}'

  queue:status:
    desc: Show crawler queue statistics.
    summary: |
      Display current crawler queue statistics (pending, active, failed counts).

      [Usage Examples]
        - task crawler:queue:status
    cmds:
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} worker npm run queue:status -- {{.CLI_ARGS}}'

  queue:dump:
    desc: Dump crawler queue to JSON.
    summary: |
      Export the full crawler queue data to a JSON file.

      [Usage Examples]
        - task crawler:queue:dump
    cmds:
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} -v {{.ROOT_DIR}}/data:/app/data worker npm run queue:dump -- {{.CLI_ARGS}}'

  queue:fix-urls:
    desc: Fix malformed URLs in the crawler queue.
    summary: |
      Scan and fix malformed URLs in the crawler queue, then display updated status.

      [Usage Examples]
        - task crawler:queue:fix-urls
    cmds:
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} worker npm run queue:status'
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} worker npm run queue:fix-urls -- {{.CLI_ARGS}}'
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} worker npm run queue:status'

  grep-errors:
    desc: Search crawler logs for errors.
    summary: |
      Grep scraper and converter logs for error patterns to diagnose issues.

      [Usage Examples]
        - task crawler:grep-errors
    cmds:
      - '{{.COMPOSE}} logs --no-color scraper converter | {{.COMPOSE}} run --rm -T {{.RUN_USER}} worker npm run log:grep-errors -- {{.CLI_ARGS}}'

  gmail:sync:
    desc: Sync Gmail messages via Gmail tool.
    summary: |
      Fetch and sync Gmail messages into the crawler pipeline.

      [Usage Examples]
        - task crawler:gmail:sync
    cmds:
      - '{{.COMPOSE}} run --rm {{.RUN_USER}} -v {{.ROOT_DIR}}/data/gmail:/data gmail npm run gmail:sync -- {{.CLI_ARGS}}'

  site:
    desc: "Run a crawler site command. Variables: SITE, CMD, PAGE, LIST_SLACK."
    summary: |
      Execute a crawler command (list, refresh-urls, refresh-silver) for a specific site.

      [Variables]
        - SITE: (필수) 대상 사이트명
        - CMD: (필수) 실행할 명령어 (list / refresh-urls / refresh-silver)
        - PAGE: (옵션) 페이지 번호 (기본값: "1")
        - LIST_SLACK: (옵션) 슬랙 로깅 제한 (기본값: "2")

      [Usage Examples]
        - task crawler:site SITE=yozm CMD=list
        - task crawler:site SITE=yozm CMD=refresh-urls
    cmds:
      - |
        if [ -z "{{.SITE}}" ] || [ -z "{{.CMD}}" ]; then
          echo "SITE and CMD variables are required. Example: task app:crawler:site SITE=yozm CMD=list"
          exit 1
        fi
        if [ "{{.CMD}}" = "list" ]; then
          {{.COMPOSE}} run --rm {{.RUN_USER}} {{.ENV_COMMON}} worker npm run scrape:{{.SITE}}:list -- --page "{{.PAGE | default "1"}}" --list-slack "{{.LIST_SLACK | default "2"}}" {{.CLI_ARGS}}
        elif [ "{{.CMD}}" = "refresh-urls" ]; then
          {{.COMPOSE}} run --rm {{.RUN_USER}} {{.ENV_COMMON}} worker npm run scrape:{{.SITE}}:refresh-urls -- --priority "{{.PRIORITY | default "medium"}}" {{if eq .OVERWRITE "true"}}--overwrite{{end}} {{if eq .ERROR_RESET "true"}}--error-reset{{end}} {{.CLI_ARGS}}
        elif [ "{{.CMD}}" = "refresh-silver" ]; then
          {{.COMPOSE}} run --rm {{.RUN_USER}} {{.ENV_COMMON}} worker npm run scrape:{{.SITE}}:refresh-silver -- {{if eq .OVERWRITE "true"}}--overwrite{{end}} {{if eq .RESET "true"}}--reset{{end}} {{.CLI_ARGS}}
        else
          echo "Unknown crawler command: {{.CMD}}"
          exit 1
        fi

  sites:list:
    desc: "Run crawler list command for a site."
    summary: |
      List crawled target URLs, metadata, and status distribution for a specific site.

      [Variables]
        - SITE: (필수) 목록을 출력할 사이트명 (예: geeknews, linkedin, yozm)
        - PAGE: (옵션) 조회할 페이지 번호 (기본값: "1")
        - LIST_SLACK: (옵션) 슬랙 로깅 제한 설정값 (기본값: "2")

      [Usage Examples]
        - task crawler:sites:list SITE="geeknews"
        - task crawler:sites:list SITE="yozm" PAGE=2
    cmds:
      - task site SITE={{.SITE}} CMD=list PAGE={{.PAGE | default "1"}} LIST_SLACK={{.LIST_SLACK | default "2"}} CLI_ARGS={{.CLI_ARGS}}

  sites:refresh:urls:
    desc: "Refresh crawler URLs for a site."
    summary: |
      Trigger crawling and scraping cycle to fetch newest URLs for a specific site.

      [Variables]
        - SITE: (필수) 새로운 URL 목록을 갱신할 사이트명 (예: gpters, linkedin)

      [Usage Examples]
        - task crawler:sites:refresh:urls SITE="gpters"
    cmds:
      - task site SITE={{.SITE}} CMD=refresh-urls CLI_ARGS={{.CLI_ARGS}}

  sites:refresh:silver:
    desc: "Refresh crawler Silver documents for a site."
    summary: |
      Re-process raw HTML data (Bronze) and convert it into structured markdown (Silver) for a specific site.

      [Variables]
        - SITE: (필수) 실버 데이터를 재생성할 사이트명 (예: maily_josh, uppity)

      [Usage Examples]
        - task crawler:sites:refresh:silver SITE="uppity"
    cmds:
      - task site SITE={{.SITE}} CMD=refresh-silver CLI_ARGS={{.CLI_ARGS}}

  extract:
    desc: Extract a single article for debugging.
    summary: |
      Extract and print a single article by site and ID for debugging purposes.

      [Variables]
        - SITE: (필수) 사이트명
        - ID: (필수) 문서 ID

      [Usage Examples]
        - task crawler:extract SITE=yozm ID=3800
    cmds:
      - |
        if [ -z "{{.SITE}}" ] || [ -z "{{.ID}}" ]; then
          echo "SITE and ID variables are required. Example: task crawler:extract SITE=yozm ID=3800"
          exit 1
        fi
        {{.COMPOSE}} run --rm {{.RUN_USER}} worker npm run extract:article -- --site {{.SITE}} --id {{.ID}} {{.CLI_ARGS}}

  debug:
    desc: Debug HTML parsing for a site or file.
    summary: |
      Debug HTML parser output for a specific article or HTML fixture file.

      [Variables]
        - SITE: (옵션) 사이트명 (ID와 함께 사용)
        - ID: (옵션) 문서 ID (SITE와 함께 사용)
        - FILE: (옵션) HTML fixture 파일 경로

      [Usage Examples]
        - task crawler:debug SITE=yozm ID=3800
        - task crawler:debug FILE=tests/sites/yozm/fixtures/3800.html
    cmds:
      - |
        if [ -n "{{.FILE}}" ]; then
          {{.COMPOSE}} run --rm {{.RUN_USER}} worker npm run debug:html -- --file {{.FILE}} {{.CLI_ARGS}}
        elif [ -n "{{.SITE}}" ] && [ -n "{{.ID}}" ]; then
          {{.COMPOSE}} run --rm {{.RUN_USER}} worker npm run debug:html -- --site {{.SITE}} --id {{.ID}} {{.CLI_ARGS}}
        else
          echo "Either FILE, or SITE and ID variables must be specified."
          echo "Example 1: task app:crawler:debug FILE=tests/sites/yozm/fixtures/3800.html"
          echo "Example 2: task app:crawler:debug SITE=yozm ID=3800"
          exit 1
        fi
