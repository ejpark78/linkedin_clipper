services:
  ebook:
    build:
      context: ${PROJECT_PATH:-.}/projects/ebook
      dockerfile: docker/Dockerfile
    image: ebook:latest
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - MONGO_URL=${MONGO_URL:-mongodb://mongodb:27017}
    volumes:
      - ${PROJECT_PATH:-.}/data/ebook:/app/data
    restart: "no"
