services:
  usd:
    image: openusd/learnusd:latest
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      traefik:
        condition: service_healthy
    volumes:
      # DooD 구성을 위한 Docker Socket 마운트
      - /var/run/docker.sock:/var/run/docker.sock
      # 호스트의 프로젝트 전체 소스코드를 컨테이너 내부 작업장으로 맵핑
      - ${PROJECT_PATH:-.}:${PROJECT_PATH:-.}
      # Container-private: 호스트 바이너리 충돌 방지 (arm64 vs amd64)
      - usd_node_modules:${PROJECT_PATH:-.}/node_modules
      - usd_venv:${PROJECT_PATH:-.}/.venv
      # IDE 설정 및 익스텐션 영구 보존 마운트
      - ${PROJECT_PATH:-.}/.sandbox/local:/home/ubuntu/.local
      - ${PROJECT_PATH:-.}/.sandbox/config:/home/ubuntu/.config
      # Antigravity CLI 및 Opencode 에이전트 자격증명 영구 보존 마운트
      - ${PROJECT_PATH:-.}/.sandbox/gemini:/home/ubuntu/.gemini
      - ${PROJECT_PATH:-.}/.sandbox/opencode:/home/ubuntu/.opencode
      - ${PROJECT_PATH:-.}/.sandbox/codex:/home/ubuntu/.codex
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - PROJECT_PATH=${PROJECT_PATH:-.}
    command: dumb-init code-server --auth none --bind-addr 0.0.0.0:8080 ${PROJECT_PATH:-.}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.usd.rule=Host(`usd.localhost`)"
      - "traefik.http.routers.usd.entrypoints=websecure"
      - "traefik.http.routers.usd.tls=true"
      - "traefik.http.services.usd.loadbalancer.server.port=8080"

volumes:
  usd_node_modules:
  usd_venv:
